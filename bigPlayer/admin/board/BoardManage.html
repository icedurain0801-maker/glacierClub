const data=[{id:2,name:'超能世界',features:['每日签到','礼包中心','积分商城','红钻商城','DIY榜单','客服中心'],news:['官方资讯','攻略大全','趣味栏目','讨论圈子','其他'],time:'2026-10-15 10:20',user:'运营管理员',on:true},{id:28,name:'我的末日基地',features:[],news:['官方公告','讨论圈子'],time:'2026-10-14 16:32',user:'张三',on:true},{id:9,name:'欢乐战三国',features:[],news:[],time:'2026-10-13 11:06',user:'李四',on:false},{id:18,name:'天境传说',features:[],news:[],time:'2026-10-12 09:18',user:'王五',on:true},{id:22,name:'我要当老祖',features:[],news:[],time:'2026-10-11 17:45',user:'运营管理员',on:true},{id:5,name:'妖神记',features:[],news:[],time:'2026-10-10 14:21',user:'运营管理员',on:true},{id:1,name:'圣魂纷争',features:[],news:[],time:'2026-10-09 10:05',user:'赵六',on:true}];
function tags(a,cyan){return a.length?a.map(x=>`<span class="tag ${cyan?'cyan':''}">${x}</span>`).join(''):'—'}function render(list=data){rows.innerHTML=list.map((x,i)=>`<tr><td>${x.id}</td><td>${x.name}</td><td><div style="width:48px;height:34px;background:#e6f7ff;color:#1890ff;display:flex;align-items:center;justify-content:center;border-radius:3px">图</div></td><td>${tags(x.features)}</td><td>${tags(x.news,true)}</td><td>${x.time}</td><td>${x.user}</td><td class="status ${x.on?'':'off'}">${x.on?'启用':'停用'}</td><td><button class="op" onclick="openDrawer(${i})">编辑</button><button class="op" onclick="toggle(${i})">${x.on?'停用':'启用'}</button><button class="op danger" onclick="removeRow(${i})">删除</button></td></tr>`).join('')}function filterRows(){const k=keyword.value.trim();render(k?data.filter(x=>x.name.includes(k)):data)}function toggle(i){data[i].on=!data[i].on;render()}function removeRow(i){if(confirm('确认删除该版块吗？删除后不可恢复。')){data.splice(i,1);render()}}function openDrawer(i){drawerTitle.textContent=i==null?'新增版块':'编辑版块';if(i!=null){formName.value=data[i].name;formIntro.value='面向玩家的社区交流版块';formCenter.value='国内'}else{formName.value='';formIntro.value='';formCenter.value=center.value}mask.classList.add('open');drawer.classList.add('open')}function closeDrawer(){mask.classList.remove('open');drawer.classList.remove('open')}function saveBoard(){if(!formName.value.trim()){alert('请填写版块名称');return}alert('提交成功');closeDrawer()}function addFeature(){featureRows.insertAdjacentHTML('beforeend',`<tr><td>≡</td><td><input class="input mini" placeholder="类别名称"></td><td><input class="input mini" placeholder="链接地址"></td><td><label class="switch"><input type="checkbox"><i></i></label></td><td><button class="op danger" onclick="this.closest('tr').remove()">删除</button></td></tr>`)}function addNews(){newsRows.insertAdjacentHTML('beforeend',`<tr><td>${newsRows.children.length+1}</td><td><input class="input mini" placeholder="类别名称"></td><td><select class="select mini"><option>帖子</option><option>动态</option></select></td><td><label class="switch"><input type="checkbox" checked><i></i></label></td><td><button class="op danger" onclick="this.closest('tr').remove()">移除</button></td></tr>`)}render();
</script>
<script>
initSidebar({ root: '../..', currentHref: 'admin/board/BoardManage.html' });
const featureTable = document.getElementById('featureRows').closest('table');
featureTable.classList.add('feature-table');
featureTable.querySelector('thead').innerHTML = '<tr><th>排序</th><th>序号</th><th>图标</th><th>类别名称</th><th>链接地址 ⓘ</th><th>是否登录</th><th>会员中心通知</th><th>渠道限制 ⓘ</th><th>白名单用户 ⓘ</th><th>拓展</th><th>操作</th></tr>';
function escapeFeature(value) { return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renumberFeatures() { document.querySelectorAll('#featureRows tr').forEach((row, i) => row.querySelector('.feature-number').textContent = i + 1); }
function removeFeature(button) { button.closest('tr').remove(); renumberFeatures(); }
function editFeatureLimit(button, label) {
  const value = prompt(label + '（多个值请用逗号分隔）', button.dataset.value || '');
  if (value === null) return;
  button.dataset.value = value;
  button.textContent = (value.trim() || (label === '渠道限制' ? '无' : '暂无')) + ' ✎';
}
function uploadFeatureIcon(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('请选择图片文件'); input.value = ''; return; }
  const reader = new FileReader();
  reader.onload = () => { const holder = input.parentElement.querySelector('.feature-icon'); holder.textContent = ''; const img = document.createElement('img'); img.src = reader.result; img.alt = '功能图标'; holder.appendChild(img); };
  reader.readAsDataURL(file);
}
addFeature = function(name = '', link = '', icon = '＋', notify = false) {
  document.getElementById('featureRows').insertAdjacentHTML('beforeend', `<tr draggable="true"><td><span class="drag-handle" title="拖动排序">≡</span></td><td class="feature-number"></td><td><label class="feature-upload" title="上传功能图标"><span class="feature-icon">${escapeFeature(icon)}</span><input type="file" accept="image/*" hidden onchange="uploadFeatureIcon(this)"></label></td><td><input class="input mini" aria-label="类别名称" placeholder="类别名称" value="${escapeFeature(name)}"></td><td><input class="input mini feature-link" aria-label="链接地址" placeholder="请输入链接地址" value="${escapeFeature(link)}"></td><td><label class="switch"><input type="checkbox" checked><i></i></label></td><td><input type="checkbox" aria-label="会员中心通知" ${notify ? 'checked' : ''}></td><td><button class="op feature-limit" onclick="editFeatureLimit(this,'渠道限制')">无 ✎</button></td><td><button class="op feature-limit" onclick="editFeatureLimit(this,'白名单用户')">暂无 ✎</button></td><td><button class="op" title="展开拓展配置" onclick="this.textContent=this.textContent==='«'?'»':'«';this.setAttribute('aria-expanded',this.textContent==='»')">«</button></td><td><button class="op danger" title="移除功能" onclick="removeFeature(this)">⊖</button></td></tr>`);
  renumberFeatures();
};
document.getElementById('featureRows').innerHTML = '';
[['每日签到','/sign-in','🎂',true],['礼包中心','/welfare','🎁',true],['积分商城','/points-mall','🎊',false],['红钻商城','/diamond-mall','💎',false],['DIY榜单','/ranking','🏆',false],['客服中心','/support','🎧',false]].forEach(row => addFeature(...row));
function attachRechargeLimit(row) {
  if (row.querySelector('.recharge-cell')) return;
  const cell = document.createElement('td');
  cell.className = 'recharge-cell';
  cell.innerHTML = '<button type="button" class="op feature-limit" onclick="editRechargeLimit(this)"><span>全部玩家</span> ✎</button>';
  row.insertBefore(cell, row.children[9]);
}
const rechargeHeader = document.createElement('th');
rechargeHeader.textContent = '充值额限制';
featureTable.querySelector('thead tr').insertBefore(rechargeHeader, featureTable.querySelector('thead tr').children[9]);
document.querySelectorAll('#featureRows tr').forEach(attachRechargeLimit);
const addFeatureWithOriginalFields = addFeature;
addFeature = function(...args) { addFeatureWithOriginalFields(...args); attachRechargeLimit(document.getElementById('featureRows').lastElementChild); };
let rechargeEditingButton = null;
function editRechargeLimit(button) {
  rechargeEditingButton = button;
  document.getElementById('rechargeAmount').value = button.dataset.amount || '';
  document.getElementById('rechargeError').textContent = '';
  document.getElementById('rechargeModal').showModal();
  document.getElementById('rechargeAmount').focus();
}
function saveRechargeLimit(event) {
  event.preventDefault();
  const value = document.getElementById('rechargeAmount').value.trim();
  if (value && !/^[1-9]\d*$/.test(value)) {
    document.getElementById('rechargeError').textContent = '请输入正整数，不支持零、负数或小数。';
    return;
  }
  rechargeEditingButton.dataset.amount = value;
  rechargeEditingButton.querySelector('span').textContent = value ? '≥ ' + value : '全部玩家';
  rechargeEditingButton.title = value ? '玩家累充额大于等于 ' + value + ' 时可见' : '不限制累充额，全部玩家均可见';
  document.getElementById('rechargeModal').close();
}
let draggedFeature = null;
document.getElementById('featureRows').addEventListener('dragstart', e => { if(e.target.matches('input')) { e.preventDefault(); return; } draggedFeature = e.target.closest('tr'); });
document.getElementById('featureRows').addEventListener('dragover', e => { e.preventDefault(); const target = e.target.closest('tr'); if (draggedFeature && target && target !== draggedFeature) { const rect = target.getBoundingClientRect(); target.parentElement.insertBefore(draggedFeature, e.clientY < rect.top + rect.height / 2 ? target : target.nextSibling); renumberFeatures(); } });
document.getElementById('featureRows').addEventListener('dragend', () => { draggedFeature = null; });
</script>

<script>
const requirementPanel = document.getElementById('help');
requirementPanel.querySelector('p').remove();
requirementPanel.insertAdjacentHTML('beforeend', `<div class="recharge-prd">
<div class="prd-version">v3.1.6 · 功能栏新增累充额限制</div>
<h4>1. 需求概述</h4>
<p>本次仅新增功能栏按钮的累充额可见性限制。运营人员可为每个功能栏按钮独立设置累充额门槛；未设置时不限制玩家累充额。其他既有功能和限制规则保持不变。</p>
<h4>2. 配置入口与流程</h4>
<p>版块管理 → 新增/编辑版块 → 功能栏配置 → “白名单用户”右侧新增“充值额限制”列 → 点击该行编辑 → 弹窗输入“累充额” → 确定后回显 → 提交版块配置。</p>
<h4>3. 字段定义</h4>
<p><strong>累充额定义：</strong>当前冰川通行证的历史累计充值金额。</p>
<table><thead><tr><th>字段</th><th>规则</th></tr></thead><tbody>
<tr><td>充值额限制（列表列）</td><td>每行独立配置。未设置显示“全部玩家”；已设置显示“≥ N”，提供编辑入口。</td></tr>
<tr><td>累充额（弹窗字段）</td><td>非必填，默认留空。填写时仅允许正整数，不支持 0、负数、小数、字母或其他非数字字符。</td></tr>
</tbody></table>
<h4>4. 编辑交互</h4>
<ul><li>编辑弹窗回填当前行已配置的累充额，未配置时输入框为空。</li><li>点击“确定”校验输入；不合法时提示“请输入正整数，不支持零、负数或小数。”，保留输入且不关闭弹窗。</li><li>清空字段并确定，取消当前按钮的累充额限制，回显“全部玩家”。</li><li>点击“取消”、关闭按钮或按 Esc，不修改原配置。</li><li>弹窗确定仅更新当前版块的编辑内容，最终随版块提交保存；保存失败不得提示成功。</li></ul>
<h4>5. 玩家端可见性规则</h4>
<table><thead><tr><th>配置/玩家情况</th><th>累充额条件判定</th></tr></thead><tbody>
<tr><td>未设置累充额限制</td><td>全部玩家通过累充额条件。</td></tr>
<tr><td>玩家累充额低于 N</td><td>不展示该功能栏按钮。</td></tr>
<tr><td>玩家累充额等于或高于 N</td><td>通过累充额条件。</td></tr>
</tbody></table>
<p>示例：门槛为 100，玩家累充额为 99 时不展示，达到 100 时通过该条件。通过累充额条件不代表绕过原有登录、渠道、白名单等规则；本次不修改这些规则的既有逻辑。</p>
<h4>6. 兼容与边界</h4>
<ul><li>历史功能栏按钮默认不设置累充额限制，保持原有可见性。</li><li>新增功能行默认“全部玩家”；不同按钮的配置互不影响。</li><li>新增配置不增加列表筛选条件，不改变既有权限和版块筛选规则。</li></ul>
</div>`);
