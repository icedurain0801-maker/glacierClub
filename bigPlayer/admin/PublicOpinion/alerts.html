<!DOCTYPE html>
<html lang="zh-CN">

<style>
:root{--blue:#1890ff;--red:#ff4d4f;--orange:#fa8c16;--green:#52c41a;--ink:#172b4d;--muted:#718096;--line:#e8edf3;--bg:#f5f7fa}
*{box-sizing:border-box}body{margin:0;display:flex;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;font-size:13px}button,input,select,textarea{font:inherit}.admin-main{flex:1;min-width:0;min-height:100vh;padding:22px 26px 40px;overflow:auto}.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.eyebrow{color:var(--blue);font-size:12px;font-weight:600;letter-spacing:.08em}.topbar h1{font-size:24px;margin:5px 0 6px;color:#14213d}.topbar p{margin:0;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.select,.input,.btn{height:32px;border:1px solid #d9e1ec;border-radius:4px;background:#fff;color:#4a5568;padding:0 9px;cursor:pointer;min-width:125px}.btn{min-width:auto}.btn:focus,.input:focus,.select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px #1890ff22}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#40a9ff}.btn:hover{border-color:var(--blue);color:var(--blue)}.page-card{background:#fff;border:1px solid var(--line);border-radius:5px;box-shadow:0 1px 3px #172b4d08;margin-bottom:14px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #f0f2f5}.card-head h2{font-size:15px;margin:0;color:#263958}.card-head small{color:var(--muted)}.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid #f0f2f5}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:980px}.table th{background:#fafbfd;color:#5d6c82;font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.table td{padding:13px 14px;color:#52627a;border-bottom:1px solid #f1f3f6;vertical-align:top}.table tr:hover td{background:#fafeff}.content-image{display:block;max-width:100%;height:auto;margin-top:8px;border:1px solid var(--line)}.content-image-error{display:block;color:#cf1322;font-size:11px;margin-top:6px}.content-meta{color:#8a97a8;font-size:11px;line-height:1.4;margin-top:5px;overflow-wrap:anywhere}.content-title{color:#30445f;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}.content-body{color:#9aa8b8;font-size:11px;line-height:1.45;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}.severity{display:inline-block;padding:2px 6px;border-radius:3px;font-size:11px;white-space:nowrap}.severity.urgent{background:#fff1f0;color:var(--red)}.severity.attention{background:#fff7e6;color:var(--orange)}.severity.normal{background:#f0f5ff;color:var(--blue)}.status{font-size:12px;color:var(--orange)}.status.resolved{color:var(--green)}.status.false_positive{color:var(--muted)}.row-action{color:var(--blue);cursor:pointer;background:transparent;border:0;padding:0;font-size:12px}.row-action:hover{text-decoration:underline}.drawer-mask{position:fixed;inset:0;background:#0e1b2a66;z-index:10;display:none}.drawer{position:absolute;right:0;top:0;height:100%;width:560px;background:#fff;box-shadow:-6px 0 18px #10223b26;padding:22px;overflow:auto}.drawer-mask.open{display:block}.drawer h2{font-size:18px;margin:0 0 8px}.drawer-close{float:right;border:0;background:#f2f4f7;border-radius:50%;width:28px;height:28px;cursor:pointer}.row-meta{color:#9aa8b8;font-size:12px;margin-bottom:6px}.detail-block{padding:15px 0;border-top:1px solid var(--line)}.detail-label{color:#8a97a8;font-size:12px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}.detail-text{line-height:1.7;color:#3f506a;white-space:pre-wrap;overflow-wrap:anywhere}.trigger-points{margin:0;padding-left:20px;color:#3f506a;line-height:1.8}.trigger-points li{padding-left:2px;white-space:pre-wrap;overflow-wrap:anywhere}.related-list{display:grid;gap:16px}.related-thread{display:grid;gap:10px}.related-content{border:1px solid var(--line);border-radius:5px;padding:12px;background:#fafbfd}.related-content.is-matched{border-color:#ffccc7;background:#fff8f7}.related-head{display:flex;align-items:center;gap:8px;min-width:0}.related-head strong{color:#2d405e;font-size:13px;overflow-wrap:anywhere}.content-type{flex:0 0 auto;padding:2px 6px;border-radius:3px;background:#e6f4ff;color:#1677ff;font-size:11px}.content-type.comment,.content-type.review{background:#f6ffed;color:#389e0d}.matched-badge{padding:2px 6px;border-radius:3px;background:#fff1f0;color:var(--red);font-size:11px}.comment-section{margin-left:12px;padding-left:14px;border-left:2px solid #edf1f5}.comment-heading{color:#718096;font-size:12px;margin:3px 0 8px}.comment-node{margin-top:8px}.comment-node.depth-2{margin-left:18px}.comment-node.depth-3{margin-left:36px}.related-meta{margin-top:7px;color:#8a97a8;font-size:11px;overflow-wrap:anywhere}.related-content-body{margin-top:10px;color:#3f506a;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.source-link{display:inline-block;margin-top:9px;color:var(--blue);font-size:12px;text-decoration:none}.source-link:hover{text-decoration:underline}.detail-empty,.detail-loading{padding:16px 0;color:#9aa8b8}.detail-error{padding:10px;border:1px solid #ffccc7;background:#fff2f0;color:#cf1322;border-radius:4px;overflow-wrap:anywhere}.state-badge{font-size:11px;padding:2px 6px;border-radius:3px;margin-left:6px}.state-badge.sent{background:#f6ffed;color:var(--green)}.state-badge.failed{background:#fff1f0;color:var(--red)}.state-badge.not_sent{background:#f0f0f0;color:#8c8c8c}.linked-row{padding:8px 0;border-bottom:1px solid #f5f5f5}.linked-row:last-child{border:0}.empty{text-align:center;padding:48px;color:#9aa8b8}.skeleton{height:18px;background:linear-gradient(90deg,#f0f2f5 25%,#e6ebf0 37%,#f0f2f5 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:3px;margin:6px 0}@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}.toast{position:fixed;right:28px;bottom:26px;background:#172b4d;color:#fff;padding:10px 15px;border-radius:4px;box-shadow:0 5px 18px #172b4d33;display:none;z-index:20}.toast.show{display:block}.command-bar{background:linear-gradient(120deg,#152a4d,#1c3a66 55%,#215085);color:#fff;padding:24px 28px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:-22px -26px 18px}.command-bar .eyebrow{color:#6fb4ff}.command-bar h1{font-size:23px;margin:5px 0 6px;color:#fff}.command-bar p{margin:0;color:rgba(255,255,255,.72)}.command-bar .top-actions{align-items:center;flex-wrap:wrap;justify-content:flex-end}.command-bar select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.26);color:#fff}.command-bar select option{color:#1a2b45}.command-bar .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}.command-bar .btn:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5);color:#fff}.command-bar .btn.primary{background:#3d97ff;border-color:#3d97ff;color:#fff}.command-bar .btn.primary:hover{background:#57a5ff;border-color:#57a5ff}@media(max-width:800px){.admin-main{padding:18px 14px}.command-bar{margin:-18px -14px 18px;padding:20px 18px}.command-bar .top-actions{justify-content:flex-start;width:100%}}
</style>
<style>.drawer #drawerContent .detail-text:has(>.content-image){overflow-x:clip}.drawer #drawerContent .detail-text:has(>.content-image)>.content-image{display:inline-block;width:auto;max-width:min(100%,480px);height:auto;vertical-align:top}</style>
<style>
.module-filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;background:#fff;border:1px solid var(--po-line);border-radius:6px}.module-filterbar [data-po-platform-scope]{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.module-filterbar .select{min-width:120px}.module-filterbar #riskControls{display:flex;align-items:center}.module-filterbar #queryBtn{margin-left:auto}@media(max-width:720px){.module-filterbar #queryBtn{margin-left:0}}
.command-bar{margin:-24px -28px 20px;padding:16px 24px;background:var(--po-surface);color:var(--po-ink);border:0;border-bottom:1px solid var(--po-line);border-radius:0;box-shadow:none}.command-bar h1{font-size:20px;color:var(--po-ink);margin:3px 0}.command-bar p{color:var(--po-muted);font-size:12px}.command-bar .eyebrow{color:var(--po-primary)}.command-bar .btn,.command-bar select{background:var(--po-surface);border-color:var(--po-line-strong);color:var(--po-text)}.command-bar .btn.primary{background:var(--po-primary);border-color:var(--po-primary);color:#fff}.module-tabs{display:flex;gap:18px;margin-top:12px;border-bottom:1px solid var(--po-line)}.module-tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--po-muted);padding:0 0 9px;cursor:pointer}.module-tab.active{border-color:var(--po-primary);color:var(--po-primary);font-weight:650}.quality-filterbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fbfcfd;border-bottom:1px solid var(--po-line)}.quality-filterbar .input,.quality-filterbar .date{min-width:145px}.quality-table{min-width:1380px}.quality-score{font-weight:650;color:var(--po-primary)}.recommend-cell{min-width:190px}.recommend-cell strong{display:block;color:#30445f;font-weight:550}.review-state{display:inline-block;margin:5px 6px 0 0;padding:2px 6px;border-radius:4px;font-size:11px;background:#f0f0f0;color:#8c8c8c}.review-state.accepted{background:var(--po-success-soft);color:var(--po-success)}.review-state.rejected{background:var(--po-danger-soft);color:var(--po-danger)}.quality-actions{display:flex;gap:5px;flex-wrap:wrap}.quality-actions .row-action{font-size:11px}.drawer .recommend-detail{padding:12px 0;border-top:1px solid var(--po-line)}.recommend-detail-head{display:flex;justify-content:space-between;gap:10px}.quality-empty{padding:44px 18px;color:var(--po-muted);text-align:center}@media(max-width:1100px){.admin-main{padding:18px}.command-bar{margin:-18px -18px 18px}}@media(max-width:720px){.admin-main{padding:14px 12px}.command-bar{margin:-14px -12px 14px;padding:14px}.module-tabs{gap:14px}.quality-filterbar{padding:12px}.quality-filterbar .input,.quality-filterbar .date{flex:1 1 150px;min-width:0}}
</style>
</head>
<body>
<nav id="sidebar" class="sidebar"></nav>
<main class="admin-main">
  <header class="command-bar"><div><div class="eyebrow">PUBLIC OPINION CENTER / 通知</div><h1>舆情通知管理</h1><p>统一管理风险告警通知与优质内容审核。</p><div class="module-tabs" role="tablist"><button class="module-tab active" type="button" data-module="risk" role="tab">风险告警管理</button><button class="module-tab" type="button" data-module="quality" role="tab">优质内容管理</button></div></div><div class="top-actions" data-po-scope></div></header>
  <div class="module-filterbar" id="moduleFilterbar"><div data-po-platform-scope></div><span id="riskControls"><select class="select" id="statusFilter"><option value="">全部状态</option><option value="pending">待处理</option><option value="processing">处理中</option><option value="resolved">已处理</option><option value="false_positive">误报</option></select></span><button class="btn primary" id="queryBtn">查询</button></div>
  <section class="page-card module-panel" id="riskPanel">
    <div class="card-head"><h2>告警列表</h2><small id="resultHint">记录发现、推送、处置和结果</small></div>
    <div class="table-wrap" id="tableContent"><div class="empty">加载中…</div></div>
  </section>
  <section class="page-card module-panel" id="qualityPanel" hidden>
    <div class="card-head"><h2>优质内容列表</h2><small id="qualityResultHint">AI 推荐候选与独立审核状态</small></div>
    <div class="quality-filterbar"><select class="input" id="recommendationTypeFilter"><option value="">全部推荐类型</option><option value="home">首页推荐</option><option value="pin">栏目置顶</option><option value="feature">加精</option></select><select class="input" id="reviewStatusFilter"><option value="">全部审核状态</option><option value="pending">待审核</option><option value="accepted">已采纳</option><option value="rejected">已忽略</option></select><select class="input" id="qualitySourceFilter"><option value="">全部采集源</option></select><input class="input date" id="publishedFromFilter" type="date" aria-label="发布时间开始"><input class="input date" id="publishedToFilter" type="date" aria-label="发布时间结束"></div>
    <div class="table-wrap" id="qualityTableContent"><div class="quality-empty">加载中…</div></div>
    <div class="pagination"><span id="qualityPageHint">第 1 页</span><button class="btn" id="qualityPrevPage">上一页</button><button class="btn" id="qualityNextPage">下一页</button><select class="select" id="qualityPageSize"><option value="20" selected>20 条/页</option><option value="50">50 条/页</option><option value="100">100 条/页</select></div>
  </section>
<div class="drawer-mask" id="drawerMask"><aside class="drawer"><button class="drawer-close" id="drawerClose">×</button><div id="drawerContent"></div></aside></div>
<div class="toast" id="toast"></div>
<script src="../../shared/sidebar-data.js?v=200"></script><script src="../../shared/sidebar.js?v=200"></script>
<script>initSidebar({root:'../..',currentHref:'admin/PublicOpinion/alerts.html'});</script>
<script src="assets/scope.js?v=147"></script><script src="assets/alert-detail.js?v=1"></script><script src="assets/alerts.js?v=146"></script>
</body>
</html>
