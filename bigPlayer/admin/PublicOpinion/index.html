  <header class="command-bar"><div><div class="eyebrow">PUBLIC OPINION CENTER / 概览</div><h1>舆情数据概览</h1><p>查看各平台的抓取数据、风险内容、告警和处理进度，快速掌握整体情况。</p></div><div class="top-actions"><div class="scope-control scope-location" data-po-scope></div></div></header>

  <style>
    /* Public opinion overview: numbered workbench */
    .overview-workbench{display:grid;gap:16px}

    .overview-section-meta{margin-left:auto;color:#8da0ba;font-size:12px;white-space:nowrap}
    .overview-section-content{min-width:0}
    .overview-section .summary-grid{margin:0;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    .overview-section .metric{min-width:0;border-radius:10px;padding:14px 15px;box-shadow:none}
    .overview-section .metric-value{font-size:24px;margin:10px 0 4px}
    .overview-section .metric-head{gap:5px}
    .overview-section .metric-head>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .overview-section .page-card{margin:0;border-radius:10px;box-shadow:none}
    .overview-section .card-head{min-height:46px;padding:12px 16px}
    .overview-section .card-head h2{font-size:14px;color:#182230}
    .overview-section .card-head .row-action{border:0;background:transparent;color:#2563eb;cursor:pointer;padding:5px 8px;margin:-5px -8px;font-size:12px;border-radius:6px;font-weight:550}
