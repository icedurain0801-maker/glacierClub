services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: public_opinion
      POSTGRES_USER: public_opinion
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - public-opinion-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  public-opinion-db:
