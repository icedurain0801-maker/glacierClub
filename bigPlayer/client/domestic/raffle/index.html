/* =====================================================
   IosFrame
   ===================================================== */
function IosFrame({ children, width = 340, height = 720, surface = '#f5f7fb', bare = false }) {
  return (
    <div style={{
      display: 'inline-block', padding: 8, background: '#000', borderRadius: 50,
      boxShadow: '0 0 0 2px #1f2937, 0 12px 40px rgba(15,23,42,0.18)',
    }}>
      <div style={{
        position: 'relative', borderRadius: 42, overflow: 'hidden',
        background: surface, width, height,
      }}>
        {!bare && (
          <>
            {/* Status bar */}
            <div style={{
              position: 'absolute', top: 0, left: 0, right: 0, height: 44,
              display: 'flex', alignItems: 'center', justifyContent: 'space-between',
              padding: '0 24px', zIndex: 40, pointerEvents: 'none',
              fontFamily: 'Manrope', fontSize: 14, fontWeight: 700,
            }}>
              <span style={{ color: 'var(--ink)' }}>9:41</span>
              <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ink)', letterSpacing: 1 }}>●●● ▮</span>
            </div>
            {/* Dynamic Island */}
            <div style={{
              position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
              width: 96, height: 30, background: '#000', borderRadius: 999, zIndex: 30,
            }} />
          </>
        )}
        {/* Content */}
        <div className="no-scrollbar" style={{
          position: 'absolute', inset: 0, paddingTop: bare ? 0 : 44,
          overflowY: bare ? 'hidden' : 'auto',
        }}>
          {bare ? <div style={{ height: '100%' }}>{children}</div> : children}
        </div>
        {/* Dynamic Island for bare mode (画面要在岛下方) */}
        {bare && (
          <div style={{
            position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
            width: 96, height: 30, background: '#000', borderRadius: 999, zIndex: 30,
          }} />
        )}
        {/* Home indicator */}
        <div style={{
          position: 'absolute', bottom: 8, left: '50%', transform: 'translateX(-50%)',
          width: 110, height: 4, background: 'rgba(0,0,0,0.45)',
          borderRadius: 999, zIndex: 50, pointerEvents: 'none',
        }} />
      </div>
    </div>
  );
}

/* =====================================================
   Shared: 印章
   ===================================================== */
function Stamp({ text1, text2, color = 'var(--primary)', size = 110, rotate = -8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" style={{ transform: `rotate(${rotate}deg)`, display: 'block', margin: '0 auto' }}>
      <defs>
        <filter id={`stamp-blur-${text1}`}><feGaussianBlur stdDeviation="0.3"/></filter>
      </defs>
      <g filter={`url(#stamp-blur-${text1})`} opacity="0.92">
        <circle cx="60" cy="60" r="54" stroke={color} strokeWidth="3" fill="none"/>
        <circle cx="60" cy="60" r="47" stroke={color} strokeWidth="1" fill="none" opacity="0.55"/>
        {[0, 72, 144, 216, 288].map((deg, i) => {
          const rad = (deg - 90) * Math.PI / 180;
          const x = 60 + Math.cos(rad) * 38;
          const y = 60 + Math.sin(rad) * 38;
          return <text key={i} x={x} y={y + 3} fontSize="9" fill={color}
            textAnchor="middle" opacity="0.75" fontFamily="Manrope" fontWeight="900">★</text>;
        })}
        <text x="60" y="56" fontSize="17" fontWeight="900" fill={color}
          textAnchor="middle" letterSpacing="3" fontFamily="Manrope">{text1}</text>
        <text x="60" y="78" fontSize="17" fontWeight="900" fill={color}
          textAnchor="middle" letterSpacing="3" fontFamily="Manrope">{text2}</text>
      </g>
    </svg>
  );
}

          <span className="material-symbols-outlined" style={{ color: 'var(--on-surface-variant)' }}>expand_more</span>
        </div>

        {/* hint */}
        <div className="rounded-lg px-3 py-2.5 flex items-start gap-2 mt-4"
          style={{ background: 'var(--surface-container-low)' }}>
          <span className="material-symbols-outlined flex-shrink-0"
            style={{ color: 'var(--primary-en)', fontSize: 18, marginTop: 1 }}>info</span>
          <div className="text-[12px]" style={{ color: 'var(--on-surface-variant)', lineHeight: 1.65 }}>
            请仔细确认角色信息，确认后将自动到账并寄送奖品。
          </div>
        </div>
      </section>

      {/* 提交按钮 */}
      <section className="mx-6 mb-4">
        <button
          onClick={() => { setConfirmed(true); setTimeout(() => navigate('post'), 1200); }}
          className="w-full rounded-full font-bold cursor-pointer"
          style={{
            background: confirmed ? 'var(--state-success, #2e7d32)' : 'var(--primary-en)',
            color: '#fff', fontFamily: 'Manrope', fontSize: 15,
            border: 'none', padding: '13px 0', letterSpacing: 2,
            boxShadow: '0 6px 18px rgba(0,97,164,0.25)',
            transition: 'background 0.2s',
          }}>
          {confirmed ? '✓ 已提交' : '确 定'}
        </button>
      </section>
    </DetailShell>
  );
}

/* =====================================================
   App + Screen switcher
   ===================================================== */
const SCREENS = [
  { id: 'post',              label: '帖子详情',     Comp: ScreenPost },
  { id: 'detail-pending',    label: '未开奖',       Comp: ScreenDetailPending },
  { id: 'detail-lost',       label: '未中奖',       Comp: ScreenDetailLost },
  { id: 'detail-won',        label: '已中奖',       Comp: ScreenDetailWon },
  { id: 'address',           label: '角色确认',     Comp: ScreenAddress },
];

function App() {
  const [current, setCurrent] = React.useState('post');
  const ScreenComp = SCREENS.find(s => s.id === current).Comp;

  return (
    <div>
      <div className="screen-switcher">
        {SCREENS.map(s => (
          <div
            key={s.id}
            className={`screen-tab ${current === s.id ? 'active' : ''}`}
            onClick={() => setCurrent(s.id)}
          >{s.label}</div>
        ))}
      </div>

      <div style={{ display: 'flex', justifyContent: 'center' }}>
        <IosFrame width={340} height={720} surface="var(--bg)" bare={true}>
          <ScreenComp navigate={setCurrent} />
        </IosFrame>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
