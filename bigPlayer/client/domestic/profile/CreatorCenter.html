<body>
<nav id="sidebar" class="sidebar sidebar--fixed-left"></nav>
<main class="creator-app">
  <div class="creator-scroll">
    <header>
      <div class="creator-top"><button class="back-btn" aria-label="返回" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios</span></button><span class="creator-title">创作中心</span></div>
      <div class="creator-profile"><img class="creator-avatar" src="https://i.pravatar.cc/96?img=12" alt="朴宝剑"/><strong class="creator-name">朴宝剑</strong><button class="report-btn">创作周报</button></div>
    </header>
    <nav class="creator-tabs" role="tablist"><button class="creator-tab active" data-tab="overview">数据总览</button><button class="creator-tab" data-tab="posts">帖子数据</button></nav>
    <section id="overview-panel" class="creator-panel">
      <div class="section"><div class="section-heading"><span><span class="material-symbols-outlined">bar_chart</span> 创作数据</span><span class="period-switch"><button class="active">近7天</button><button>近30天</button></span></div>
        <div class="metric-grid"><div class="metric"><strong>1</strong><span>评论数</span></div><div class="metric"><strong>0</strong><span>点赞数</span></div></div>
        <div class="metric-grid small"><div class="metric"><strong>0</strong><span>浏览数</span></div><div class="metric"><strong>0</strong><span>粉丝数</span></div><div class="metric"><strong>0</strong><span>收藏数</span></div></div>
        <div class="chart-title">浏览数趋势</div><div class="chart"><span class="chart-point"></span></div><div class="chart-date">10-09</div>
        <div class="chart-title">浏览用户地区分布</div><div class="empty-chart"><div class="empty-illustration"></div>当前暂无数据噢</div>
      </div>
    </section>
    <section id="posts-panel" class="creator-panel" hidden><div class="empty-chart" style="padding-top:58px">暂无帖子数据</div></section>
    <section class="task-section"><div class="task-title"><span class="material-symbols-outlined">assignment</span> 创作任务</div><div class="task-head"><div>任务<div class="task-period"><span class="material-symbols-outlined" style="font-size:13px;vertical-align:-2px">schedule</span>2026/10/09-2027/10/01</div></div><span class="task-status">进行中</span></div><div class="task-list"><div class="task-item"><div class="task-icon"><span class="material-symbols-outlined">checklist</span></div><div class="task-copy"><div class="task-name">发布创作成功达1次&nbsp; 0/1</div><div class="creator-reward"><span class="creator-reward-label">奖励：</span><strong>+1 经验值</strong></div></div></div><div class="task-item"><div class="task-icon"><span class="material-symbols-outlined">checklist</span></div><div class="task-copy"><div class="task-name">评论成功达1次&nbsp; 1/1</div><div class="creator-reward"><span class="creator-reward-label">奖励：</span><span class="creator-item-reward" data-item-name="英雄拼图 · 2 个" title="英雄拼图 · 2 个" tabindex="0"><img class="creator-item-icon" src="../assets/welfare-prop-4002.png" alt=""/><i class="creator-item-count">2</i></span></div></div></div><div class="task-item"><div class="task-icon"><span class="material-symbols-outlined">checklist</span></div><div class="task-copy"><div class="task-name">获赞达1次&nbsp; 0/1</div><div class="creator-reward"><span class="creator-reward-label">奖励：</span><strong>星耀头像框、极光个性背景</strong></div></div></div></div></section>
  </div>
</main>
<script src="../../../shared/sidebar-data.js?v=20261010-creator-center"></script><script src="../../../shared/sidebar.js?v=sidebar-system-split-v037"></script><script>initSidebar({root:'../../..',currentHref:'client/domestic/profile/CreatorCenter.html'});</script>
<script>
document.querySelectorAll('.creator-tab').forEach(tab => tab.addEventListener('click', () => { document.querySelectorAll('.creator-tab').forEach(item => item.classList.toggle('active', item === tab)); document.getElementById('overview-panel').hidden = tab.dataset.tab !== 'overview'; document.getElementById('posts-panel').hidden = tab.dataset.tab !== 'posts'; }));
document.querySelectorAll('.period-switch button').forEach(button => button.addEventListener('click', () => { button.parentElement.querySelectorAll('button').forEach(item => item.classList.toggle('active', item === button)); }));
</script>
<script>
window.requirementPanelConfig = {
  title: '创作者中心需求说明',
  version: 'v3.1.4',
  html: `
    <section>
      <h2>v3.1.4 · 创作者中心</h2>
      <h3>一、任务奖励展示规则</h3>
      <p>创作任务奖励与福利任务页保持一致，任务名称下方统一以“奖励：”作为前缀，按后台配置的奖励类型展示。</p>
      <ul>
        <li>经验值：展示“+{经验值数量} 经验值”。</li>
        <li>游戏道具：展示道具 ICON 与数量角标；鼠标悬停或键盘聚焦 ICON 时，展示“道具名称 · 数量”提示。一个任务配置多个道具时，按后台返回顺序横向排列。</li>
        <li>个性装扮：头像框、个性背景直接展示装扮名称与数量；不展示道具 ICON。</li>
        <li>奖励内容过长时，任务行高度随内容自然撑开，不截断奖励信息，不与任务标题、进度或状态重叠。</li>
      </ul>
    </section>
  `
};
</script>
<script src="../../../shared/requirement-panel.js?v=20261010-creator-center"></script>
