    background: #f7f9fb;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tl-card:active { background: #edf1f5; }

  .tl-body { flex: 1; min-width: 0; padding: 10px 12px; }
  .time-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 7px;
    border-radius: 20px;
    font-size: 9.5px;
    font-weight: 600;
    margin-bottom: 5px;

  /* 搜索下拉行 */
  #search-bar-row {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1);
    background: #fff;
    border-bottom: 1px solid transparent;
    transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1), border-color 0.28s;
  }
  #search-bar-row.open {
    max-height: 52px;
    border-color: #e8eff3;
  }
  #search-bar-row .inner {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
  }
  .search-box-row {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: #f0f4f8; border-radius: 20px; padding: 5px 10px;
  }
  .search-box-row input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 12px; color: #1a2a35; min-width: 0;
  }
  .search-box-row input::placeholder { color: #a9b4b9; }
  .search-empty {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 0; color: #a9b4b9; gap: 6px;
    font-size: 13px;

<script>
let followed = false;

function toggleFollow() {
  followed = !followed;
  const btn = document.getElementById('follow-btn');
  const icon = document.getElementById('follow-icon');
  const text = document.getElementById('follow-text');
  if (followed) {
    btn.style.background = 'rgba(255,255,255,0.9)';
    btn.style.color = '#0061a4';
    btn.style.borderColor = 'rgba(0,97,164,0.3)';
    icon.textContent = 'person_check';
    icon.style.color = '#0061a4';
    text.textContent = '已关注';
    text.style.color = '#0061a4';
  } else {
    btn.style.background = 'rgba(255,255,255,0.22)';
    btn.style.color = '#fff';
    btn.style.borderColor = 'rgba(255,255,255,0.5)';
    icon.textContent = 'person_add';
    icon.style.color = '#fff';
    text.textContent = '关注';
    text.style.color = '#fff';
  }
}

// Tab switching
(function () {
  const btns = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-panel');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      btns.forEach(b => {
        const active = b.dataset.tab === target;
        b.classList.toggle('font-bold', active);
        b.classList.toggle('text-[#1f2937]', active);
        b.classList.toggle('text-[#566166]', !active);
        b.querySelector('.tab-line').classList.toggle('hidden', !active);
      });
      panels.forEach(p => {
        p.classList.toggle('hidden', p.id !== 'tab-' + target);
      });
    });
  });
})();

// ── 创作数据 ──────────────────────────────────────────────
const posts = [
  { date: '03-20 · 09:46', action: '发布了该帖子', title: '123', body: '123123', img: 'https://picsum.photos/seed/post1/160/120' },
  { date: '02-02 · 14:42', action: '发布了动态',   title: '',    body: 'efagrsae' },
  { date: '12-05 · 10:35', action: '发布了该帖子', title: '123', body: '123' },
  { date: '12-03 · 17:14', action: '发布了该帖子', title: '',    body: '测测测测测测测额膀侧测测测测测额膀侧测测测测额膀侧测测测测额膀侧测测测测额膀侧测测测测额膀侧测测测测测...' },
  { date: '09-25 · 09:16', action: '发布了动态',   title: '',    body: '早上好！今天天气不错，继续游戏冲冲冲 💪' },
];

function renderPosts(list) {
  const container = document.getElementById('post-list');
  const empty = document.getElementById('search-empty');
  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.map(p => `
    <div class="tl-card">
      <div class="tl-stripe" style="background:linear-gradient(180deg,#0061a4,#3ab4e8)"></div>
      <div class="tl-body">
        <div class="time-pill" style="background:#e8f4ff;color:#0061a4">
          <span style="font-size:8px">●</span> ${p.date} · ${p.action}
        </div>
        ${p.title || p.img ? `
        <div class="flex gap-2.5 items-center">
          <div class="flex-1 min-w-0">
            ${p.title ? `<div class="text-[13px] font-semibold text-[#1a2a35] truncate">${p.title}</div>` : ''}
            ${p.body  ? `<div class="text-[11px] text-slate-500 truncate mt-0.5">${p.body}</div>` : ''}
          </div>
          ${p.img ? `<img src="${p.img}" class="w-[66px] h-[48px] rounded-lg object-cover flex-shrink-0" alt=""/>` : ''}
        </div>` : `
        <div class="text-[12px] text-[#2a3439] line-clamp-3 leading-relaxed">${p.body}</div>`}
      </div>
    </div>
  `).join('');
}

// 初始渲染
renderPosts(posts);

// ── 搜索逻辑（方案B：第二行展开）──────────────────────────
let searchOpen = false;

function openSearch() {
  searchOpen = true;
  document.getElementById('search-bar-row').classList.add('open');
  document.getElementById('search-icon-btn').style.display = 'none';
  setTimeout(() => document.getElementById('search-input').focus(), 50);
}

function closeSearch() {
  searchOpen = false;
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('search-bar-row').classList.remove('open');
  document.getElementById('search-icon-btn').style.display = '';
  renderPosts(posts);
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('search-input').focus();
  renderPosts(posts);
}

function filterPosts() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  renderPosts(q ? posts.filter(p => (p.title + p.body + p.action).toLowerCase().includes(q)) : posts);
}

// 切换到点赞 tab 时关闭搜索
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const showSearch = btn.dataset.tab === 'creations';
      document.getElementById('search-icon-btn').style.display = showSearch ? '' : (searchOpen ? 'none' : '');
      if (!showSearch && searchOpen) closeSearch();
    });
  });
});
</script>
</body>
</html>
