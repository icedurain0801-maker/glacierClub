<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>我的</title>
<link rel="stylesheet" href="../../../shared/sidebar.css?v=20260920-sidebar3"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf1f5;color:#202b35;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}::-webkit-scrollbar{display:none}
.app{width:100%;max-width:396px;height:100dvh;margin:0 auto;background:#f6f8fb;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 28px rgba(21,48,72,.16)}.profile-scroll{flex:1;overflow-y:auto;padding-bottom:74px}.profile-cover{height:120px;position:relative;overflow:hidden;background:linear-gradient(170deg,rgba(38,154,228,.58),rgba(10,74,126,.78)),url('https://picsum.photos/seed/game-profile-banner/900/300') center/cover}.profile-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(7,31,54,.55))}.cover-actions{position:absolute;z-index:1;right:16px;bottom:13px;display:flex;gap:10px}.cover-action{width:36px;height:36px;border:1px solid rgba(255,255,255,.48);border-radius:50%;background:rgba(20,64,93,.36);color:#fff;display:grid;place-items:center;backdrop-filter:blur(8px);cursor:pointer}.cover-action .material-symbols-outlined{font-size:19px}
.profile-summary{position:relative;background:#fff;padding:0 16px 14px}.avatar{position:absolute;left:17px;top:-42px;width:76px;height:76px;border:3px solid #fff;border-radius:50%;background:url('https://i.pravatar.cc/160?img=12') center/cover;box-shadow:0 2px 8px rgba(24,59,85,.25)}.level{position:absolute;left:22px;top:25px;padding:1px 6px;border:2px solid #fff;border-radius:10px;background:#0873bc;color:#fff;font-size:10px;font-weight:700;line-height:16px}.profile-row{height:52px;margin-left:90px;display:flex;align-items:center;justify-content:space-between}.profile-name{font-size:17px;font-weight:750;color:#202e39}.profile-edit{border:0;background:transparent;color:#0572ba;font-size:14px;font-weight:700;display:flex;gap:3px;align-items:center;cursor:pointer}.profile-edit .material-symbols-outlined{font-size:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:3px 0 0}.stat{text-align:center;position:relative}.stat:not(:last-child):after{content:"";width:1px;height:30px;background:#e7edf2;position:absolute;right:0;top:4px}.stat b{display:block;font-size:19px;line-height:22px;color:#152b3a}.stat b.blue{color:#0075bd}.stat span{font-size:11px;color:#8b99a5}
.quick-actions{display:grid;grid-template-columns:1.1fr .9fr 1.25fr;gap:8px;padding:12px 16px;background:#fff;border-top:1px solid #eff3f6}.quick-action{min-width:0;height:38px;padding:0 7px;display:flex;align-items:center;justify-content:center;gap:4px;border:1px solid #dce5ec;border-radius:20px;background:#fff;color:#5a6670;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}.quick-action.primary{border-color:#087bc5;background:#087bc5;color:#fff}.quick-action .material-symbols-outlined{font-size:16px;flex:0 0 auto}.tabs{height:48px;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #e5edf3}.tab{position:relative;border:0;background:transparent;color:#99a6b0;font-size:14px;cursor:pointer}.tab.active{font-weight:750;color:#087ac3}.tab.active:after{content:"";height:3px;border-radius:3px;background:#087ac3;position:absolute;bottom:0;left:33%;right:33%}.search-wrap{padding:14px;background:#f6f8fb;border-bottom:1px solid #e2eaf0}.search{height:34px;border-radius:8px;background:#edf2f6;display:flex;align-items:center;padding:0 10px;color:#8b99a5}.search .material-symbols-outlined{font-size:17px}.search input{width:100%;border:0;outline:0;background:transparent;padding-left:6px;font-size:13px;color:#26343d}.search input::placeholder{color:#9aa7b1}
.content-list{background:#fff}.list-item{min-height:100px;padding:12px 14px;display:flex;gap:11px;border-bottom:1px solid #e6edf2}.thumbnail{width:68px;height:76px;flex:0 0 68px;border-radius:8px;background:#eaf1f5;display:grid;place-items:center;overflow:hidden}.thumbnail .material-symbols-outlined{width:39px;height:39px;display:grid;place-items:center;border-radius:50%;background:#fff;color:#9aa9b4;font-size:19px;box-shadow:0 2px 7px rgba(51,75,92,.08)}.post-copy{min-width:0;flex:1;padding-top:2px}.post-title{font-size:14px;font-weight:750;color:#26343d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-desc{margin-top:5px;font-size:12px;color:#657580;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.post-meta{margin-top:6px;display:flex;align-items:center;gap:7px;font-size:11px;color:#8d9aa4}.status{padding:1px 5px;border-radius:3px;background:#fff0f1;color:#e44d5d;font-size:10px;font-weight:700}.empty{display:none;min-height:210px;place-items:center;color:#9aa8b1;font-size:13px;background:#fff}.empty .material-symbols-outlined{display:block;font-size:36px;margin-bottom:8px;text-align:center;color:#c2ced6}.empty.show{display:grid}.plain-panel{display:none;min-height:240px;place-items:center;background:#fff;color:#9aa8b1;font-size:13px}.plain-panel.show{display:grid}.plain-panel .material-symbols-outlined{display:block;text-align:center;font-size:38px;color:#c4ced5;margin-bottom:8px}@media(min-width:769px){.app{margin-left:max(256px,calc(50% - 198px));margin-right:auto}}@media(max-width:768px){.app{max-width:none;box-shadow:none}}
</style>
</head>
<body>
<nav id="sidebar" class="sidebar sidebar--fixed-left"></nav>
<main class="app">
<div class="profile-scroll"><header><div class="profile-cover"><div class="cover-actions"><button class="cover-action" aria-label="我的勋章" onclick="location.href='badge.html'"><span class="material-symbols-outlined">military_tech</span></button><button class="cover-action" aria-label="设置" onclick="location.href='settings.html'"><span class="material-symbols-outlined">settings</span></button></div></div><section class="profile-summary"><div class="avatar" aria-label="用户头像"></div><div class="level">Lv.4</div><div class="profile-row"><strong class="profile-name">超能鹿战队</strong><button class="profile-edit"><span class="material-symbols-outlined">edit</span>编辑</button></div><div class="stats"><div class="stat"><b>4</b><span>创作</span></div><div class="stat"><b class="blue">14</b><span>总获赞</span></div><div class="stat"><b>2</b><span>关注</span></div><div class="stat"><b class="blue">1</b><span>粉丝</span></div></div></section><div class="quick-actions"><button class="quick-action primary" onclick="location.href='../home/notifications.html'"><span class="material-symbols-outlined">notifications</span>消息通知</button><button class="quick-action" onclick="location.href='../publish/drafts.html'"><span class="material-symbols-outlined">draft</span>草稿箱</button><button class="quick-action" onclick="location.href='CreatorCenter.html'"><span class="material-symbols-outlined">star</span>创作者中心</button></div></header>
<section aria-label="个人内容"><div class="tabs" role="tablist"><button class="tab active" data-tab="creations">创作</button><button class="tab" data-tab="comments">评论</button><button class="tab" data-tab="likes">点赞</button><button class="tab" data-tab="favorites">收藏</button></div><div class="search-wrap" id="search-wrap"><label class="search"><span class="material-symbols-outlined">search</span><input id="profile-search" placeholder="请输入关键字" autocomplete="off"/></label></div><div class="content-list" id="creation-list"></div><div class="empty" id="search-empty"><div><span class="material-symbols-outlined">search_off</span>没有找到相关内容</div></div><div class="plain-panel" id="tab-empty"><div><span class="material-symbols-outlined" id="empty-icon">chat_bubble</span><span id="empty-text">暂无评论</span></div></div></section></div>
<bottom-nav active="profile" base="../"></bottom-nav>
</main>
<script>
const posts=[{title:'测试',desc:'',status:'审核不通过',time:'04-29 15:20'},{title:'9999999',desc:'sdasdasdas',status:'审核不通过',time:'07-12 19:10'},{title:'448875',desc:'21312312',status:'审核不通过',time:'07-12 19:04'},{title:'哈哈还是',desc:'213123',status:'审核中',time:'07-13 10:28'}];
const creationList=document.getElementById('creation-list'),empty=document.getElementById('search-empty'),tabEmpty=document.getElementById('tab-empty'),searchWrap=document.getElementById('search-wrap');
function renderPosts(data){creationList.innerHTML=data.map(item=>`<article class="list-item"><div class="thumbnail"><span class="material-symbols-outlined">image</span></div><div class="post-copy"><div class="post-title">${item.title}</div>${item.desc?`<div class="post-desc">${item.desc}</div>`:''}<div class="post-meta"><span class="status">${item.status}</span><span>${item.time}</span></div></div></article>`).join('');empty.classList.toggle('show',data.length===0)}renderPosts(posts);
document.getElementById('profile-search').addEventListener('input',function(){const keyword=this.value.trim().toLowerCase();renderPosts(keyword?posts.filter(item=>(item.title+item.desc).toLowerCase().includes(keyword)):posts)});
const emptyMap={comments:['chat_bubble','暂无评论'],likes:['thumb_up','暂无点赞'],favorites:['bookmark','暂无收藏']};
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.tab;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===button));const isCreation=tab==='creations';creationList.style.display=isCreation?'':'none';empty.classList.toggle('show',isCreation&&creationList.children.length===0);searchWrap.style.display=isCreation?'':'none';tabEmpty.classList.toggle('show',!isCreation);if(!isCreation){document.getElementById('empty-icon').textContent=emptyMap[tab][0];document.getElementById('empty-text').textContent=emptyMap[tab][1]}}));
</script>
<script src="../../shared/bottom-nav.js"></script><script src="../../../shared/sidebar-data.js?v=20260921-c-end-version2"></script><script src="../../../shared/sidebar.js?v=sidebar-system-split-v037"></script><script>initSidebar({root:'../../..',currentHref:'client/domestic/profile/profile.html'});</script><script src="../../../shared/requirement-panel.js?v=20260921-requirements"></script>
</body>
</html>
