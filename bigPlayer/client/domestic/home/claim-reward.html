<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>领取奖励 · 大玩家</title>
<link rel="stylesheet" href="../../../shared/sidebar.css?v=20260920-sidebar3">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  :root { --primary:#0061a4; --ink:#263740; --muted:#6e818c; --line:#d8e6ee; --surface:#f4f9fc; }
  * { box-sizing:border-box; }
  body { margin:0; background:#eef4f8; color:var(--ink); font-family:Inter,"Microsoft YaHei",sans-serif; display:flex; justify-content:center; }
  .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  .phone-shell { width:375px; min-height:667px; margin:20px 0; background:var(--surface); box-shadow:2px 0 16px rgba(0,0,0,.1); }
  .phone { height:667px; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  .topbar { height:52px; flex:0 0 52px; display:flex; align-items:center; gap:10px; padding:0 16px; background:#fff; border-bottom:1px solid var(--line); }
  .back { width:30px; height:30px; border:0; background:transparent; padding:0; color:var(--ink); cursor:pointer; }
  .topbar h1 { margin:0; font:800 17px Manrope,"Microsoft YaHei",sans-serif; }
  .content { flex:1; overflow-y:auto; padding:17px 16px 88px; }
  .content::-webkit-scrollbar { display:none; }
  .event-banner { background:#d9edfb; border-left:4px solid #0877bc; border-radius:12px; padding:15px 16px; }
  .event-banner .eyebrow { color:#427c9d; font-size:10px; }
  .event-banner h2 { margin:8px 0 4px; font:800 21px Manrope,"Microsoft YaHei",sans-serif; }
  .event-banner p { margin:0; color:#5f8194; font-size:11px; }
  .field-label, .section-title { display:block; margin:18px 0 7px; color:var(--muted); font-size:12px; }
  select { width:100%; appearance:auto; border:1px solid #b8d6e7; border-radius:9px; background:#fff; color:var(--ink); padding:12px; font:14px Inter,"Microsoft YaHei",sans-serif; }
  .reward-list { background:#fff; border:1px solid var(--line); border-radius:11px; overflow:hidden; }
  .reward-row { display:flex; align-items:center; gap:11px; min-height:58px; padding:9px 11px; border-bottom:1px solid #e8f0f4; }
  .reward-row:last-child { border-bottom:0; }
  .reward-icon { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border-radius:10px; background:#e5f3fc; color:#1479bb; font-size:21px; }
  .reward-icon.cosmetic { background:#edf7f3; color:#33876e; }
  .reward-copy { min-width:0; flex:1; }
  .reward-copy strong, .reward-copy small { display:block; }
  .reward-copy strong { font-size:13px; }
  .reward-copy small { margin-top:3px; color:#79909d; font-size:11px; }
  .reward-count { color:var(--primary); font-size:12px; font-weight:700; white-space:nowrap; }
  .bottom-action { position:absolute; right:0; bottom:0; left:0; padding:12px 16px 13px; background:rgba(255,255,255,.96); border-top:1px solid var(--line); }
  .claim { width:100%; height:44px; border:0; border-radius:9px; background:var(--primary); color:#fff; font:700 14px Inter,"Microsoft YaHei",sans-serif; cursor:pointer; }
  .bottom-action p { margin:8px 0 0; color:#8ba0ad; font-size:10px; text-align:center; }
  .success-mask { position:absolute; inset:0; z-index:5; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(16,61,90,.45); }
  .success-mask.show { display:flex; }
  .success-card { width:100%; padding:28px 20px; border-radius:16px; background:#fff; text-align:center; }
  .success-icon { width:52px; height:52px; margin:0 auto 13px; display:grid; place-items:center; border-radius:50%; background:#dff2fc; color:#1479bb; font-size:29px; }
  .success-card h2 { margin:0; font:800 21px Manrope,"Microsoft YaHei",sans-serif; }
  .success-card p { margin:9px 0 4px; color:var(--muted); font-size:12px; }
  .success-card small { color:#98aab4; font-size:10px; }
  @media (max-width:430px) { body { background:var(--surface); } .phone-shell { width:100vw; margin:0; box-shadow:none; } .phone { height:100dvh; } }
</style>
</head>
<body>
<nav id="sidebar" class="sidebar sidebar--fixed-left"></nav>
<div class="phone-shell">
  <div class="phone">
    <header class="topbar">
      <button class="back" aria-label="返回系统通知" onclick="window.location.href='notifications.html'"><span class="material-symbols-outlined">arrow_back_ios</span></button>
      <h1>领取奖励</h1>
    </header>
    <main class="content">
      <section class="event-banner">
        <div class="eyebrow">XXXX活动 · 奖励通知</div>
        <h2>恭喜获得活动奖励</h2>
        <p>请选择领取角色，奖励将发放至该角色背包。</p>
      </section>
      <label class="field-label" for="character">领取角色</label>
      <select id="character" aria-label="领取角色">
        <option>星河战士（10001）</option>
        <option>暗夜骑士（10002）</option>
        <option>烈焰行者（10003）</option>
      </select>
      <div class="section-title">奖励内容（共 7 件）</div>
      <section class="reward-list" aria-label="奖励内容">
        <div class="reward-row"><div class="reward-icon">✦</div><div class="reward-copy"><strong>高级经验药水</strong></div><span class="reward-count">×2</span></div>
        <div class="reward-row"><div class="reward-icon">⚔</div><div class="reward-copy"><strong>强化石</strong></div><span class="reward-count">×20</span></div>
        <div class="reward-row"><div class="reward-icon">◉</div><div class="reward-copy"><strong>金币补给箱</strong></div><span class="reward-count">×3</span></div>
        <div class="reward-row"><div class="reward-icon">✧</div><div class="reward-copy"><strong>传送卷轴</strong></div><span class="reward-count">×5</span></div>
        <div class="reward-row"><div class="reward-icon">▣</div><div class="reward-copy"><strong>双倍经验卡</strong></div><span class="reward-count">×1</span></div>
        <div class="reward-row"><div class="reward-icon cosmetic">◇</div><div class="reward-copy"><strong>星海头像框</strong></div><span class="reward-count">×1</span></div>
        <div class="reward-row"><div class="reward-icon cosmetic">▧</div><div class="reward-copy"><strong>星海背景</strong></div><span class="reward-count">×1</span></div>
      </section>
    </main>
    <footer class="bottom-action">
      <button class="claim" onclick="claimReward()">领取全部奖励</button>
      <p>领取成功后将自动返回系统通知</p>
    </footer>
    <div class="success-mask" id="success-mask" aria-live="polite">
      <div class="success-card"><div class="success-icon">✓</div><h2>领取成功</h2><p id="success-copy">奖励已发放至星河战士</p><small>正在返回系统通知列表…</small></div>
    </div>
  </div>
</div>
<script>
  function claimReward() {
    const character = document.getElementById('character').value;
    document.getElementById('success-copy').textContent = `奖励已发放至${character}`;
    document.getElementById('success-mask').classList.add('show');
    window.setTimeout(() => { window.location.href = 'notifications.html?tab=system&claimed=1'; }, 1200);
  }
</script>
<script src="../../../shared/sidebar-data.js?v=20260923-c-end-version3"></script>
<script src="../../../shared/sidebar.js?v=sidebar-system-split-v037"></script>
<script>initSidebar({ root: '../../..', currentHref: 'client/domestic/home/notifications.html' });</script>
<script>
  window.requirementPanelConfig = {
    title: '系统通知与奖励领取需求说明',
    version: 'v3.1.4',
    html: `
      <section>
        <h2>v3.1.4 · 道具获得通知与领取</h2>
        <h3>一、入口</h3>
        <p>用户从系统通知中的“道具获得通知”点击“点击领取”进入本页。</p>
        <h3>二、领取规则</h3>
        <ul>
          <li>角色下拉选项显示为“角色名称（角色ID）”。</li>
          <li>奖励列表支持多个游戏道具，名称与数量独立展示。</li>
          <li>头像框和背景同样只展示名称与数量，不展示类型小字。</li>
        </ul>
        <h3>三、完成态</h3>
        <p>领取成功后显示成功反馈，并自动回到系统通知列表。</p>
      </section>
    `
  };
</script>
<script src="../../../shared/requirement-panel.js?v=20260921-requirements"></script>
</body>
</html>
