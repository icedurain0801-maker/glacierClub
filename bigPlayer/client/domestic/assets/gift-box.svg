<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Shadow -->
  <ellipse cx="32" cy="60" rx="22" ry="4" fill="#b8a0d0" opacity="0.45"/>
  <!-- Box bottom -->
  <rect x="10" y="32" width="44" height="24" rx="3" fill="#e63e2f"/>
  <rect x="10" y="32" width="44" height="24" rx="3" fill="url(#boxShade)"/>
  <!-- Dots on box -->
  <circle cx="20" cy="42" r="2.2" fill="#e8944a" opacity="0.6"/>
  <circle cx="44" cy="42" r="2.2" fill="#e8944a" opacity="0.6"/>
  <circle cx="18" cy="52" r="1.8" fill="#e8944a" opacity="0.5"/>
  <circle cx="46" cy="52" r="1.8" fill="#e8944a" opacity="0.5"/>
  <circle cx="26" cy="49" r="2" fill="#e8944a" opacity="0.55"/>
  <circle cx="38" cy="49" r="2" fill="#e8944a" opacity="0.55"/>
  <!-- Vertical ribbon -->
  <rect x="27" y="32" width="10" height="24" fill="#f5b731"/>
  <rect x="27" y="32" width="10" height="24" fill="url(#ribbonShade)"/>
  <!-- Box lid -->
  <rect x="7" y="24" width="50" height="10" rx="3" fill="#e63e2f"/>
  <rect x="7" y="24" width="50" height="10" rx="3" fill="url(#lidShade)"/>
  <!-- Lid ribbon -->
  <rect x="27" y="24" width="10" height="10" fill="#f5b731"/>
  <!-- Bow center -->
  <ellipse cx="32" cy="22" rx="5" ry="4.5" fill="#f0a520"/>
  <ellipse cx="32" cy="22" rx="3.5" ry="3" fill="#f5b731"/>
  <!-- Bow left loop -->
  <ellipse cx="22" cy="18" rx="9" ry="6" fill="#f5b731" transform="rotate(-15 22 18)"/>
  <ellipse cx="22" cy="18" rx="6.5" ry="4" fill="#f0a520" transform="rotate(-15 22 18)"/>
  <!-- Bow right loop -->
  <ellipse cx="42" cy="18" rx="9" ry="6" fill="#f5b731" transform="rotate(15 42 18)"/>
  <ellipse cx="42" cy="18" rx="6.5" ry="4" fill="#f0a520" transform="rotate(15 42 18)"/>
  <!-- Bow center knot -->
  <ellipse cx="32" cy="21" rx="4.5" ry="4" fill="#f0a520"/>
  <ellipse cx="32" cy="21" rx="3" ry="2.8" fill="#f5b731"/>
  <defs>
    <linearGradient id="boxShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ribbonShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="lidShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
