            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-gray-100 flex justify-center font-body-md text-on-surface antialiased">
<div class="w-full max-w-[428px] h-[100dvh] bg-white shadow-2xl flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-[0_2px_4px_rgba(0,68,204,0.06)] sticky top-0 z-50 shrink-0">
<div class="flex items-center w-full px-3 h-14 gap-2">
  <div class="flex items-center gap-1 shrink-0">
    <button class="flex items-center justify-center w-8 h-8 hover:bg-blue-50 transition-colors active:scale-95 duration-200 rounded-full" onclick="location.href='../home/home.html'">
      <span class="material-symbols-outlined text-slate-500" style="font-size:20px">arrow_back</span>
    </button>
    <button class="text-blue-400 text-xs font-medium hover:text-blue-500 active:scale-95 transition-all whitespace-nowrap" onclick="location.href='drafts.html'">草稿箱</button>
  </div>
  <h1 class="flex-1 text-center text-base font-bold text-blue-600 font-['Inter'] antialiased whitespace-nowrap">发布投稿</h1>
  <div class="flex items-center gap-1.5 shrink-0">
    <button id="saveDraftBtn" class="text-slate-300 text-xs font-medium whitespace-nowrap cursor-not-allowed" disabled>保存草稿</button>
    <button class="bg-gradient-to-r from-[#0066FF] to-[#00A2FF] text-white text-xs font-semibold px-4 py-1.5 rounded-full shadow-md shadow-blue-400/20 hover:brightness-110 transition-all active:scale-95 duration-200 whitespace-nowrap">发布</button>
  </div>
</div>
</header>
<main class="flex-1 overflow-y-auto px-4 pb-4 pt-4">
<!-- Editor Header Section -->
<div class="mb-3 relative bg-white/50 backdrop-blur-sm rounded-xl p-4 border border-blue-100/50">
<div class="flex justify-between items-start mb-2">
<label class="text-label-sm text-primary uppercase tracking-wider">标题</label>
<span class="text-[10px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">0/100</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 font-headline-xl text-on-surface placeholder-slate-300 p-0 leading-tight" maxlength="100" placeholder="输入标题（必填）" type="text"/>
</div>
<!-- Divider -->
<div class="h-px w-full bg-gradient-to-r from-transparent via-slate-200 to-transparent mb-4"></div>
<!-- Main Content Area -->
<article class="relative">
<div class="flex flex-col gap-4">
<textarea id="mainTextarea" class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-on-surface placeholder-slate-300 p-0 leading-relaxed resize-none overflow-hidden" style="min-height:200px;height:200px" placeholder="开始写正文…" oninput="this.style.height='200px';this.style.height=Math.max(200,this.scrollHeight)+'px'"></textarea>
<div class="flex justify-between items-center pt-4 border-t border-slate-100">
<div class="flex gap-3">
<span class="text-xs text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">image</span>
<span id="imgCount">0</span>/3 张图片
</span>
<span class="text-xs text-slate-400 flex items-center gap-1">
<span class="material-symbols-outlined text-sm">videocam</span>
<span id="vidCount">0</span>/3 个视频
</span>
</div>
<span class="text-label-sm text-slate-400 font-medium tracking-wide">0/5000 字</span>
</div>
</div>
</article>
<!-- Suggested Tags Section -->
<div class="mt-4 pt-4 border-t border-slate-100">
  <p class="text-label-md text-slate-500 font-semibold mb-3">推荐话题</p>
  <div class="flex flex-wrap gap-2">
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-primary text-white transition-all active:scale-95">#攻略教学</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#同人创作</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#长文投稿</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#玩家故事</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-500 hover:bg-slate-200 transition-all active:scale-95">+ 探索更多</button>
  </div>
</div>
<!-- Asymmetric Decorative Card -->
</main>
<!-- BottomNavBar (Formatting Toolbar) -->
<div class="shrink-0 bg-white/95 backdrop-blur-md border-t border-slate-100 px-4 pt-2 pb-2 flex flex-col gap-3">
<div class="flex items-center">
<button class="bg-[#F1F4F9] text-[#5E636E] px-3 py-1.5 rounded-full text-sm font-normal flex items-center gap-1 hover:bg-[#E4E8F0] active:scale-95 transition-all">
  <span class="material-symbols-outlined text-base text-slate-400" style="font-size:16px">grid_view</span>
  <span class="opacity-60 text-xs">栏目：</span>
  <span>攻略 - 先祖策略</span>
  <span class="material-symbols-outlined text-slate-400" style="font-size:16px">unfold_more</span>
</button>
</div>
</div><nav class="shrink-0 flex justify-between items-center px-6 py-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<button class="flex items-center justify-center text-primary bg-primary/10 rounded-lg p-2 active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24">text_fields</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">format_list_bulleted</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">mood</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">image</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">videocam</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">insert_chart</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">link</span>
</button>
<button class="flex items-center justify-center text-slate-500 dark:text-slate-400 p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg active:scale-95 transition-all">
<span class="material-symbols-outlined text-2xl">alternate_email</span>
</button>
</nav>
<script>
  const titleInput = document.querySelector('input[placeholder="Enter Title (Required)"]');
  const bodyInput = document.getElementById('mainTextarea');
  const saveBtn = document.getElementById('saveDraftBtn');
  function updateSaveBtn() {
    const hasContent = titleInput.value.trim() || bodyInput.value.trim();
    if (hasContent) {
      saveBtn.disabled = false;
      saveBtn.className = 'text-blue-500 text-xs font-medium hover:text-blue-600 active:scale-95 transition-all whitespace-nowrap cursor-pointer';
    } else {
      saveBtn.disabled = true;
      saveBtn.className = 'text-slate-300 text-xs font-medium whitespace-nowrap cursor-not-allowed';
    }
  }
  titleInput.addEventListener('input', updateSaveBtn);
  bodyInput.addEventListener('input', updateSaveBtn);
</script>
<!-- Global Decoration Elements -->
</div>
</body></html>
</body></html>
