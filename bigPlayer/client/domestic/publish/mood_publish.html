<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
  #mediaUploadZone { transition: all 0.2s; }
  #previewGrid { display: none; }
  #previewGrid.has-images { display: grid; }
  .preview-item { position: relative; border-radius: 10px; overflow: hidden; background: #e2e7ff; }
  .preview-item img,
  .preview-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .preview-item .del-btn {
    position: absolute; top: 5px; right: 5px;
    width: 22px; height: 22px;
    background: rgba(0,0,0,0.55); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s;
  }
  .preview-item .del-btn:hover { background: rgba(0,0,0,0.78); }
  .add-more-slot {
    border: 2px dashed #c2c6d8; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; gap: 4px; transition: border-color 0.15s, background 0.15s;
    background: #f2f3ff;
  }
  .add-more-slot:hover { border-color: #0050cb; background: #eef0ff; }

</head>
<body class="bg-gray-100 flex justify-center text-on-background font-body-md">
<div class="w-full max-w-[428px] h-[100dvh] bg-white shadow-2xl flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-[0_2px_4px_rgba(0,68,204,0.06)] sticky top-0 z-50 shrink-0">
<div class="flex items-center w-full px-3 h-14 gap-2">
  <div class="flex items-center gap-1 shrink-0">
    <button class="flex items-center justify-center w-8 h-8 hover:bg-blue-50 transition-colors active:scale-95 duration-200 rounded-full" onclick="location.href='../home/home.html'">
      <span class="material-symbols-outlined text-slate-500" style="font-size:20px">arrow_back</span>
    </button>
    <button class="text-blue-400 text-xs font-medium hover:text-blue-500 active:scale-95 transition-all whitespace-nowrap" onclick="location.href='drafts.html'">草稿箱</button>
  </div>
  <h1 class="flex-1 text-center text-base font-bold text-blue-600 font-['Inter'] antialiased whitespace-nowrap">发布动态</h1>
  <div class="flex items-center gap-1.5 shrink-0">
    <button id="saveDraftBtn" class="text-slate-300 text-xs font-medium whitespace-nowrap cursor-not-allowed" disabled>保存草稿</button>
    <button class="bg-gradient-to-r from-[#0066FF] to-[#00A2FF] text-white text-xs font-semibold px-4 py-1.5 rounded-full shadow-md shadow-blue-400/20 hover:brightness-110 transition-all active:scale-95 duration-200 whitespace-nowrap">发布</button>
  </div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-4 py-4">
<div class="space-y-6">
<!-- Content Input Section -->
<div class="space-y-4">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-body-md placeholder:text-outline-variant resize-none min-h-[120px] font-body-md" placeholder="分享你的想法…"></textarea>
<!-- Media Upload Bento Card -->
<input type="file" id="fileInput" accept="image/*,video/*" multiple class="hidden" onchange="handleFiles(this.files)">

<!-- Empty state: upload placeholder -->
<div id="mediaUploadZone" class="group relative aspect-video md:aspect-[21/9] w-full rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low hover:bg-surface-container hover:border-primary transition-all cursor-pointer flex flex-col items-center justify-center overflow-hidden" onclick="document.getElementById('fileInput').click()">
<div class="flex flex-col items-center gap-3 transition-transform group-hover:scale-105">
<div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px]" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
<div class="text-center">
<p class="font-label-md text-on-surface">添加图片或视频</p>
<p class="text-label-sm text-on-surface-variant">支持照片或视频，最大 50MB</p>
</div>
</div>
</div>

<!-- Preview grid (shown after upload) -->
<div id="previewGrid" class="grid gap-2" style="grid-template-columns: repeat(3, 1fr)">
<!-- preview items injected by JS -->
</div>
</div>
<!-- Suggested Tags -->
<div class="mt-4 pt-4 border-t border-slate-100">
  <p class="text-label-md text-slate-500 font-semibold mb-3">推荐话题</p>
  <div class="flex flex-wrap gap-2">
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-primary text-white transition-all active:scale-95">#截图分享</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#攻略心得</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#玩家圈</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-600 hover:bg-slate-200 transition-all active:scale-95">#日常碎碎念</button>
    <button class="px-4 py-2 rounded-full text-sm font-medium bg-[#EEF0FF] text-slate-500 hover:bg-slate-200 transition-all active:scale-95">+ 探索更多</button>
  </div>
</div>
</div>
</main>
<!-- 栏目选择栏 -->
<div class="shrink-0 bg-white/95 backdrop-blur-md border-t border-slate-100 px-4 pt-2 pb-2 flex flex-col gap-3">
<div class="flex items-center">
<button class="bg-[#F1F4F9] text-[#5E636E] px-3 py-1.5 rounded-full text-sm font-normal flex items-center gap-1 hover:bg-[#E4E8F0] active:scale-95 transition-all">
  <span class="material-symbols-outlined text-slate-400" style="font-size:16px">grid_view</span>
  <span class="opacity-60 text-xs">栏目：</span>
  <span>攻略 - 先祖策略</span>
  <span class="material-symbols-outlined text-slate-400" style="font-size:16px">unfold_more</span>
</button>
</div>
</div>
<!-- BottomNavBar (Toolbar) -->
<nav class="shrink-0 flex justify-between items-center px-6 py-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<button class="flex items-center justify-center text-primary bg-primary/10 rounded-lg p-2 active:scale-95 transition-all">
  <span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24">mood</span>
</button>
<button class="flex items-center justify-center text-slate-500 p-2 hover:bg-slate-100 rounded-lg active:scale-95 transition-all">
  <span class="material-symbols-outlined text-2xl">image</span>
</button>
<button class="flex items-center justify-center text-slate-500 p-2 hover:bg-slate-100 rounded-lg active:scale-95 transition-all">
  <span class="material-symbols-outlined text-2xl">crop_free</span>
</button>
<button class="flex items-center justify-center text-slate-500 p-2 hover:bg-slate-100 rounded-lg active:scale-95 transition-all">
  <span class="material-symbols-outlined text-2xl">insert_chart</span>
</button>
<button class="flex items-center justify-center text-slate-500 p-2 hover:bg-slate-100 rounded-lg active:scale-95 transition-all">
  <span class="material-symbols-outlined text-2xl">alternate_email</span>
</button>
</nav>
<script>
const MAX_FILES = 9;
let mediaFiles = [];

function handleFiles(fileList) {
  const incoming = Array.from(fileList).filter(f => f.size <= 50 * 1024 * 1024);
  const remaining = MAX_FILES - mediaFiles.length;
  mediaFiles = mediaFiles.concat(incoming.slice(0, remaining));
  renderPreviews();
  updateDraftBtn();
}

function removeFile(idx) {
  mediaFiles.splice(idx, 1);
  renderPreviews();
  updateDraftBtn();
}

function renderPreviews() {
  const grid = document.getElementById('previewGrid');
  const zone = document.getElementById('mediaUploadZone');

  if (mediaFiles.length === 0) {
    grid.innerHTML = '';
    grid.classList.remove('has-images');
    zone.style.display = '';
    return;
  }

  zone.style.display = 'none';
  grid.classList.add('has-images');

  // Adjust columns: 1 file = 1 col, 2 = 2 col, 3+ = 3 col
  const cols = mediaFiles.length === 1 ? 1 : mediaFiles.length === 2 ? 2 : 3;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  const cellH = mediaFiles.length === 1 ? '200px' : '110px';

  let html = mediaFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    const isVideo = f.type.startsWith('video/');
    const media = isVideo
      ? `<video src="${url}" muted playsinline style="pointer-events:none"></video>`
      : `<img src="${url}" alt="图片${i+1}">`;
    return `
      <div class="preview-item" style="height:${cellH}">
        ${media}
        <div class="del-btn" onclick="removeFile(${i})">
          <span class="material-symbols-outlined text-white" style="font-size:13px">close</span>
        </div>
      </div>`;
  }).join('');

  // Add-more slot if under limit
  if (mediaFiles.length < MAX_FILES) {
    html += `
      <div class="add-more-slot" style="height:${cellH}" onclick="document.getElementById('fileInput').click()">
        <span class="material-symbols-outlined text-slate-400" style="font-size:22px">add</span>
        <span style="font-size:11px;color:#727687">${mediaFiles.length}/${MAX_FILES}</span>
      </div>`;
  }

  grid.innerHTML = html;
}

function updateDraftBtn() {
  const textarea = document.querySelector('textarea');
  const btn = document.getElementById('saveDraftBtn');
  const hasContent = textarea.value.trim().length > 0 || mediaFiles.length > 0;
  btn.disabled = !hasContent;
  btn.className = hasContent
    ? 'text-slate-500 text-xs font-medium whitespace-nowrap hover:text-slate-700 transition-colors'
    : 'text-slate-300 text-xs font-medium whitespace-nowrap cursor-not-allowed';
}

document.querySelector('textarea').addEventListener('input', updateDraftBtn);

// Bottom toolbar image button also triggers upload
document.querySelectorAll('nav button')[1].addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
</script>
</div>
</body></html>
