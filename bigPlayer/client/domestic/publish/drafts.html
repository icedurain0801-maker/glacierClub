<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>草稿箱</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0061a4'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  ::-webkit-scrollbar { display: none; }

  /* 草稿行 */
  .draft-row {
    background: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid #f0f0f2;
    cursor: pointer;
    transition: background 0.1s;
  }
  .draft-row:active { background: #f5f7fa; }

  /* 图标容器 */
  .draft-icon {
    width: 40px; height: 40px; border-radius: 9px;
    background: #e8f2fb;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  /* 缩略图 */
  .draft-thumb {
    width: 56px; height: 40px;
    border-radius: 7px;
    object-fit: cover;
    flex-shrink: 0;
  }

  /* 删除按钮 */
  .del-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    transition: background 0.1s;
  }
  .del-btn:active { background: #fff0f0; }

  /* 底部操作表 */
  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .confirm-sheet {
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%; max-width: 428px;
  }
</style>
</head>
<body class="bg-gray-100 flex justify-center selection:bg-blue-200 text-gray-900 font-sans">

<main class="w-full max-w-[428px] h-[100dvh] bg-[#f5f7fa] relative flex flex-col overflow-hidden">

  <!-- 顶栏 -->
  <header class="bg-white shrink-0 border-b border-black/[0.05]">
    <div class="flex items-center px-3 py-[11px] relative">
      <button onclick="history.back()"
        class="flex items-center justify-center w-9 h-9 rounded-full active:bg-gray-100 absolute left-2"
        aria-label="返回">
        <span class="material-symbols-outlined text-gray-600" style="font-size:22px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">arrow_back_ios</span>
      </button>
      <div class="flex-1 text-center text-[17px] font-semibold text-gray-900">草稿箱</div>
      <button id="clear-all-btn" onclick="confirmClearAll()"
        class="absolute right-4 text-[13px] font-medium text-red-500 active:opacity-60"
        style="display:none">
        清空
      </button>
    </div>
  </header>

  <!-- 列表区 -->
  <div class="flex-1 overflow-y-auto">
    <div id="draft-list"></div>

    <!-- 空状态 -->
    <div id="empty-state" style="display:none" class="flex flex-col items-center justify-center pt-32">
      <span class="material-symbols-outlined text-[52px] text-gray-200 mb-3" style="font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 48">draft</span>
      <div class="text-[14px] text-gray-400">暂无草稿</div>
    </div>
  </div>

</main>

<!-- 删除单条确认 -->
<div class="confirm-overlay" id="delete-confirm" style="display:none" onclick="cancelDelete()">
  <div class="confirm-sheet" onclick="event.stopPropagation()">
    <div class="text-[15px] font-semibold text-gray-900 mb-1">删除草稿</div>
    <div class="text-[13px] text-gray-400 mb-6">确定要删除这条草稿吗？删除后无法恢复。</div>
    <button onclick="doDelete()"
      class="w-full py-3 rounded-2xl bg-red-500 text-white text-[15px] font-semibold mb-3 active:opacity-80">
      删除
    </button>
    <button onclick="cancelDelete()"
      class="w-full py-3 rounded-2xl bg-[#f0f4f8] text-gray-900 text-[15px] font-medium active:opacity-80">
      取消
    </button>
  </div>
</div>

<!-- 清空确认 -->
<div class="confirm-overlay" id="clear-confirm" style="display:none" onclick="cancelClear()">
  <div class="confirm-sheet" onclick="event.stopPropagation()">
    <div class="text-[15px] font-semibold text-gray-900 mb-1">清空草稿箱</div>
    <div class="text-[13px] text-gray-400 mb-6">确定要清空所有草稿吗？删除后无法恢复。</div>
    <button onclick="doClearAll()"
      class="w-full py-3 rounded-2xl bg-red-500 text-white text-[15px] font-semibold mb-3 active:opacity-80">
      清空
    </button>
    <button onclick="cancelClear()"
      class="w-full py-3 rounded-2xl bg-[#f0f4f8] text-gray-900 text-[15px] font-medium active:opacity-80">
      取消
    </button>
  </div>
</div>

<script>
let drafts = [
  { id: 1, date: '04-29 16:49', title: '上发顺丰',  body: '手动阀霸',  img: null },
  { id: 2, date: '04-29 16:49', title: '',           body: '苏打水',   img: null },
  { id: 3, date: '04-28 10:21', title: '宝箱大礼包', body: '今天签到领取了宝箱大礼包，感觉超值！', img: 'https://picsum.photos/seed/treasure/160/120' },
];

let pendingDeleteId = null;

function render() {
  const list = document.getElementById('draft-list');
  const empty = document.getElementById('empty-state');
  const clearBtn = document.getElementById('clear-all-btn');

  if (drafts.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'flex';
    clearBtn.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  clearBtn.style.display = '';

  list.innerHTML = drafts.map(d => `
    <div class="draft-row" id="row-${d.id}" onclick="openDraft(${d.id})">
      <div class="draft-icon">
        <span class="material-symbols-outlined text-primary" style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">edit_note</span>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:500;color:${d.title ? '#111827' : '#9ca3af'};font-style:${d.title ? 'normal' : 'italic'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
          ${d.title || '未命名草稿'}
        </div>
        ${d.body ? `<div style="font-size:12px;color:#9ca3af;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.body}</div>` : ''}
        <div style="font-size:11px;color:#d1d5db;margin-top:3px;">${d.date}</div>
      </div>
      ${d.img ? `<img src="${d.img}" class="draft-thumb" alt="" onclick="event.stopPropagation()"/>` : ''}
      <button class="del-btn" onclick="event.stopPropagation();confirmDelete(${d.id})" aria-label="删除">
        <span class="material-symbols-outlined text-red-400" style="font-size:18px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">delete</span>
      </button>
    </div>
  `).join('');
}

function openDraft(id) {
  // 跳转至编辑页（待实现）
  alert('打开草稿 #' + id);
}

function confirmDelete(id) {
  pendingDeleteId = id;
  document.getElementById('delete-confirm').style.display = 'flex';
}
function cancelDelete() {
  pendingDeleteId = null;
  document.getElementById('delete-confirm').style.display = 'none';
}
function doDelete() {
  drafts = drafts.filter(d => d.id !== pendingDeleteId);
  cancelDelete();
  render();
}

function confirmClearAll() {
  document.getElementById('clear-confirm').style.display = 'flex';
}
function cancelClear() {
  document.getElementById('clear-confirm').style.display = 'none';
}
function doClearAll() {
  drafts = [];
  cancelClear();
  render();
}

render();
</script>
</body>
</html>
