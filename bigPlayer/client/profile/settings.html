<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>设置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0061a4'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  ::-webkit-scrollbar { display: none; }
  body { background: #f0f2f5; }

  /* 开关 */
  .toggle-wrap { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0;
    border-radius: 999px;
    background: #d1d5db;
    transition: background 0.22s;
    cursor: pointer;
  }
  .toggle-wrap input:checked + .toggle-track { background: #0061a4; }
  .toggle-knob {
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.20);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none;
  }
  .toggle-wrap input:checked ~ .toggle-knob { transform: translateX(18px); }

  /* 行点击态 */
  .menu-row { transition: background 0.12s; }
  .menu-row:active { background: #f0f2f5; }
</style>
</head>
<body class="flex justify-center selection:bg-blue-200 font-sans">

<main class="w-full max-w-[428px] min-h-[100dvh] bg-[#f0f2f5] relative flex flex-col">

  <!-- 顶栏 -->
  <div class="bg-white flex items-center px-3 pt-[12px] pb-[12px] sticky top-0 z-10 border-b border-black/[0.04]">
    <button onclick="history.length > 1 ? history.back() : location.href='profile.html'" class="w-9 h-9 flex items-center justify-center rounded-full -ml-1 active:bg-gray-100">
      <span class="material-symbols-outlined text-[22px] text-gray-600" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">arrow_back_ios</span>
    </button>
    <span class="flex-1 text-center text-[17px] font-semibold text-gray-900 -ml-9">设置</span>
  </div>

  <!-- 内容 -->
  <div class="flex-1 py-4 flex flex-col gap-3">

    <!-- 第一组：通知 + 黑名单 -->
    <div class="bg-white mx-3 rounded-2xl overflow-hidden shadow-sm">

      <!-- 通知设置 -->
      <div class="menu-row flex items-center px-4 py-[15px] border-b border-black/[0.04] cursor-pointer">
        <span class="text-[15px] text-gray-900 font-medium flex-1">通知设置</span>
        <span class="text-[12px] text-primary mr-1.5">设置推送消息</span>
        <span class="material-symbols-outlined text-[18px] text-gray-300" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">chevron_right</span>
      </div>

      <!-- 管理黑名单 -->
      <div class="menu-row flex items-center px-4 py-[15px] cursor-pointer">
        <span class="text-[15px] text-gray-900 font-medium flex-1">管理黑名单</span>
        <span class="material-symbols-outlined text-[18px] text-gray-300" style="font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">chevron_right</span>
      </div>

    </div>

    <!-- 第二组：深色模式 -->
    <div class="bg-white mx-3 rounded-2xl overflow-hidden shadow-sm">
      <div class="menu-row flex items-center px-4 py-[15px]">
        <span class="text-[15px] text-gray-900 font-medium flex-1">深色模式</span>
        <!-- 开关 -->
        <label class="toggle-wrap">
          <input type="checkbox" id="dark-toggle" onchange="toggleDark(this)"/>
          <div class="toggle-track"></div>
          <div class="toggle-knob"></div>
        </label>
      </div>
    </div>

    <!-- 第三组：校验页面 -->
    <div class="bg-white mx-3 rounded-2xl overflow-hidden shadow-sm">
      <div class="menu-row flex items-center px-4 py-[15px] cursor-pointer">
        <div class="flex-1">
          <div class="text-[15px] text-gray-900 font-medium">校验页面</div>
          <div class="text-[12px] text-primary mt-0.5">校验页面</div>
        </div>
      </div>
    </div>

    <!-- 退出 -->
    <div class="bg-white mx-3 rounded-2xl overflow-hidden shadow-sm mt-1">
      <button class="menu-row w-full px-4 py-[15px] text-center text-[15px] font-medium text-red-500">
        退出当前账号
      </button>
    </div>

  </div>

  <!-- 右下角吉祥物 -->
  <div class="fixed bottom-6 right-6 z-20 pointer-events-none select-none">
    <div style="
      width: 52px; height: 52px; border-radius: 50%;
      background: #0061a4;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,97,164,0.35);
    ">
      <span class="material-symbols-outlined text-white text-[26px]" style="font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">smart_toy</span>
    </div>
    <!-- 小白身体 -->
    <div style="
      position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
      width: 38px; height: 18px;
      background: #f0f4f8; border-radius: 999px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.10);
    "></div>
  </div>

</main>

<script>
function toggleDark(el) {
  // 仅演示，暂不实现真实深色模式
}
</script>
</body>
</html>
