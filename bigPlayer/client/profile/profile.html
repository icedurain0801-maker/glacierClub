<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8"/>

<title>个人中心</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#0061a4'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
  ::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .avatar-silhouette {
    background: linear-gradient(160deg, #ffd9d9 0%, #ffc0cb 40%, #d4a8d4 100%);
    position: relative;
    overflow: hidden;
  }
  .avatar-silhouette::before {
    content: '';
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    top: 20%; left: 50%; transform: translateX(-50%);
  }
  .avatar-silhouette::after {
    content: '';
    position: absolute;
    width: 44px; height: 34px;
    border-radius: 50% 50% 0 0;
    background: rgba(255,255,255,0.5);
    bottom: 0; left: 50%; transform: translateX(-50%);
  }
  .tl-card {
    display: flex;
    background: #f7f9fb;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.15s;
  }
  .tl-card:active { background: #edf1f5; }
  .tl-stripe { width: 4px; flex-shrink: 0; }
  .tl-body { flex: 1; min-width: 0; padding: 10px 12px; }
  /* 搜索下拉行 */
  #profile-search-bar-row {
    overflow: hidden;
    max-height: 0;
    background: #fff;
    border-bottom: 1px solid transparent;
    transition: max-height 0.28s cubic-bezier(0.4,0,0.2,1), border-color 0.28s;
  }
  #profile-search-bar-row.open {
    max-height: 52px;
    border-color: #e8eff3;
  }
  #profile-search-bar-row .inner {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
  }
  .profile-search-box {
    flex: 1; display: flex; align-items: center; gap: 6px;
    background: #f0f4f8; border-radius: 20px; padding: 5px 10px;
  }
  .profile-search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 12px; color: #1a2a35; min-width: 0;
  }
  .profile-search-box input::placeholder { color: #a9b4b9; }
  .profile-search-empty {
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 0; color: #a9b4b9; gap: 6px;
    font-size: 13px;
  }
  .time-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 7px;
    border-radius: 20px;
    font-size: 9.5px;
    font-weight: 600;
    margin-bottom: 5px;
  }
</style>
</head>

                   font-size:10px">${b.emoji}</div>`
    ).join('');
    const moreTag = extra > 0
      ? `<span style="font-size:10px;color:rgba(255,255,255,0.9);font-weight:700;margin-left:3px">+${extra} ›</span>`
      : `<span style="font-size:10px;color:rgba(255,255,255,0.9);font-weight:700;margin-left:3px">›</span>`;

    el.innerHTML = `
      <div onclick="alert('徽章墙弹层（待实现）')"
           style="display:flex;align-items:center;gap:2px;
                  background:rgba(255,255,255,0.20);backdrop-filter:blur(10px);

                  padding:4px 8px 4px 5px;cursor:pointer">
        <div style="display:flex;gap:1px">${icons}</div>
        ${moreTag}
      </div>`;
  }
}

// Tab switching + search
(function () {
  const btns = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-panel');
  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      btns.forEach(b => {
        const active = b.dataset.tab === target;
        b.classList.toggle('font-bold', active);
        b.classList.toggle('text-[#1f2937]', active);
        b.classList.toggle('text-[#566166]', !active);
        b.querySelector('.tab-line').classList.toggle('hidden', !active);
      });
      panels.forEach(p => {
        p.classList.toggle('hidden', p.id !== 'tab-' + target);
      });
      const showSearch = target === 'creations';
      const iconBtn = document.getElementById('profile-search-icon-btn');
      iconBtn.style.display = showSearch ? '' : 'none';
      if (!showSearch) profileCloseSearch();
    });
  });
})();

function profileRenderPosts(list) {
  const container = document.getElementById('profile-post-list');
  const empty = document.getElementById('profile-search-empty');
  if (list.length === 0) {
    container.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  container.innerHTML = list.map(p => {
    const hasTitle = !!p.title;
    const hasImg = !!p.img;
    let content = '';
    if (hasTitle && hasImg) {
      content = `<div class="flex gap-2.5 items-center">
        <div class="flex-1 min-w-0">
          <div class="text-[13px] font-semibold text-[#1a2a35] truncate">${p.title}</div>
          <div class="text-[11px] text-slate-500 truncate mt-0.5">${p.body}</div>
        </div>
        <img src="${p.img}" class="w-[66px] h-[48px] rounded-lg object-cover flex-shrink-0" alt=""/>
      </div>`;
    } else if (hasTitle) {
      content = `<div class="text-[13px] font-semibold text-[#1a2a35] mb-0.5">${p.title}</div>
        <div class="text-[11px] text-slate-500 line-clamp-2 leading-relaxed">${p.body}</div>`;
    } else if (hasImg) {
      content = `<div class="flex gap-2.5 items-center">
        <div class="flex-1 min-w-0">
          <div class="text-[12px] text-[#2a3439] line-clamp-2 leading-snug">${p.body}</div>
        </div>
        <img src="${p.img}" class="w-[66px] h-[48px] rounded-lg object-cover flex-shrink-0" alt=""/>
      </div>`;
    } else {
      content = `<div class="text-[12px] text-[#2a3439] line-clamp-3 leading-relaxed">${p.body}</div>`;
    }
    return `<div class="tl-card">
      <div class="tl-stripe" style="background:${p.stripe}"></div>
      <div class="tl-body">
        <div class="time-pill" style="background:${p.pillBg};color:${p.pillColor}"><span style="font-size:8px">●</span> ${p.date}</div>
        ${content}
      </div>
    </div>`;
  }).join('');
}

profileRenderPosts(profilePosts);

// ── 搜索逻辑 ─────────────────────────────────────────────────
let profileSearchOpen = false;

function profileOpenSearch() {
  profileSearchOpen = true;
  document.getElementById('profile-search-bar-row').classList.add('open');
  document.getElementById('profile-search-icon-btn').style.display = 'none';
  setTimeout(() => document.getElementById('profile-search-input').focus(), 50);
}

function profileCloseSearch() {
  profileSearchOpen = false;
  const input = document.getElementById('profile-search-input');
  if (input) input.value = '';
  const clear = document.getElementById('profile-search-clear');
  if (clear) clear.style.display = 'none';
  document.getElementById('profile-search-bar-row').classList.remove('open');
  document.getElementById('profile-search-icon-btn').style.display = '';
  profileRenderPosts(profilePosts);
}

function profileClearSearch() {
  document.getElementById('profile-search-input').value = '';
  document.getElementById('profile-search-clear').style.display = 'none';
  document.getElementById('profile-search-input').focus();
  profileRenderPosts(profilePosts);
}

function profileFilterPosts() {
  const q = document.getElementById('profile-search-input').value.trim().toLowerCase();
  document.getElementById('profile-search-clear').style.display = q ? 'block' : 'none';
  profileRenderPosts(q ? profilePosts.filter(p => (p.title + p.body).toLowerCase().includes(q)) : profilePosts);
}
