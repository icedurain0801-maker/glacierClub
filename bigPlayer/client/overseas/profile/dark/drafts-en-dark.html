<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>BigPlayer — Drafts (EN)</title>
<link rel="stylesheet" href="../../../shared/sidebar.css">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "on-surface-variant": "#8b949e",
          "secondary-container": "#1f3a56",
          "primary": "#4493f8",
          "primary-dim": "#3882ef",
          "surface-container-low": "#161b22",
          "surface-variant": "#30363d",
          "outline": "#6e7681",
          "surface-container": "#1c2128",
          "on-secondary-container": "#79c0ff",
          "surface-container-lowest": "#0d1117",
          "surface-container-highest": "#30363d",
          "on-primary": "#0d1117",
          "outline-variant": "#30363d",
          "surface-container-high": "#21262d",
          "on-surface": "#e6edf3",
          "background": "#0d1117",
          "inverse-primary": "#79c0ff",
          "surface": "#0d1117",
          "surface-tint": "#4493f8"
        },
        fontFamily: {
          headline: ["Manrope"],
          body: ["Inter"],
          label: ["Inter"]
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .draft-row {
    background: #161b22;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid #1c2128;
    cursor: pointer;
    transition: background 0.12s;
  }
  .draft-row:active { background: #161b22; }

  .draft-icon {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: #1f3a56;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .draft-thumb {
    width: 56px; height: 42px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .del-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    transition: background 0.12s;
  }
  .del-btn:active { background: rgba(248,81,73,.12); }

  .confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.36);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .confirm-sheet {
    background: #161b22;
    border-radius: 24px 24px 0 0;
    padding: 28px 20px 40px;
    width: 100%; max-width: 428px;
  }
</style>
</head>
<body class="bg-[#1a1f26] flex justify-center font-body text-on-surface selection:bg-blue-200">

<main class="w-full max-w-[428px] h-[100dvh] bg-background relative flex flex-col overflow-hidden">

  <!-- Top bar -->
  <header class="bg-surface-container-lowest shrink-0 border-b border-outline-variant/30">
    <div class="flex items-center px-3 py-[11px] relative">
      <button onclick="history.back()"
        class="flex items-center justify-center w-9 h-9 rounded-full active:bg-surface-container-low absolute left-2"
        aria-label="Back">
        <span class="material-symbols-outlined text-on-surface-variant" style="font-size:22px">arrow_back_ios</span>
      </button>
      <div class="flex-1 text-center text-[17px] font-semibold font-headline text-on-surface">Drafts</div>
      <button id="clear-all-btn" onclick="confirmClearAll()"
        class="absolute right-4 text-[13px] font-medium text-red-500 active:opacity-60"
        style="display:none">
        Clear All
      </button>
    </div>
  </header>

  <!-- List area -->
  <div class="flex-1 overflow-y-auto no-scrollbar">
    <div id="draft-list"></div>

    <!-- Empty state -->
    <div id="empty-state" style="display:none" class="flex flex-col items-center justify-center pt-32">
      <span class="material-symbols-outlined text-[56px] text-outline-variant mb-3"
        style="font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 48">draft</span>
      <div class="text-[14px] text-on-surface-variant">No drafts yet</div>
    </div>
  </div>

</main>

<!-- Delete single confirmation -->
<div class="confirm-overlay" id="delete-confirm" style="display:none" onclick="cancelDelete()">
  <div class="confirm-sheet" onclick="event.stopPropagation()">
    <div class="text-[15px] font-semibold font-headline text-on-surface mb-1">Delete Draft</div>
    <div class="text-[13px] text-on-surface-variant mb-6">Are you sure you want to delete this draft? This action cannot be undone.</div>
    <button onclick="doDelete()"
      class="w-full py-3 rounded-2xl bg-red-500 text-white text-[15px] font-semibold font-headline mb-3 active:opacity-80">
      Delete
    </button>
    <button onclick="cancelDelete()"
      class="w-full py-3 rounded-2xl bg-surface-container-low text-on-surface text-[15px] font-medium active:opacity-80">
      Cancel
    </button>
  </div>
</div>

<!-- Clear all confirmation -->
<div class="confirm-overlay" id="clear-confirm" style="display:none" onclick="cancelClear()">
  <div class="confirm-sheet" onclick="event.stopPropagation()">
    <div class="text-[15px] font-semibold font-headline text-on-surface mb-1">Clear All Drafts</div>
    <div class="text-[13px] text-on-surface-variant mb-6">Are you sure you want to clear all drafts? This action cannot be undone.</div>
    <button onclick="doClearAll()"
      class="w-full py-3 rounded-2xl bg-red-500 text-white text-[15px] font-semibold font-headline mb-3 active:opacity-80">
      Clear All
    </button>
    <button onclick="cancelClear()"
      class="w-full py-3 rounded-2xl bg-surface-container-low text-on-surface text-[15px] font-medium active:opacity-80">
      Cancel
    </button>
  </div>
</div>

<script>
let drafts = [
  { id: 1, date: 'Apr 29 · 16:49', title: 'Unboxing Review', body: 'Just received the package today', img: null },
  { id: 2, date: 'Apr 29 · 16:49', title: '',                body: 'Sparkling water haul',           img: null },
  { id: 3, date: 'Apr 28 · 10:21', title: 'Treasure Box',    body: 'Got the daily check-in reward — totally worth it!', img: 'https://picsum.photos/seed/treasure/160/120' },
];

let pendingDeleteId = null;

function render() {
  const list  = document.getElementById('draft-list');
  const empty = document.getElementById('empty-state');
  const clearBtn = document.getElementById('clear-all-btn');

  if (drafts.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'flex';
    clearBtn.style.display = 'none';
    return;
  }

  empty.style.display = 'none';
  clearBtn.style.display = '';

  list.innerHTML = drafts.map(d => `
    <div class="draft-row" id="row-${d.id}" onclick="openDraft(${d.id})">
      <div class="draft-icon">
        <span class="material-symbols-outlined text-primary" style="font-size:20px">edit_note</span>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:500;color:${d.title ? '#e6edf3' : '#6e7681'};font-style:${d.title ? 'normal' : 'italic'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter;">
          ${d.title || 'Untitled Draft'}
        </div>
        ${d.body ? `<div style="font-size:12px;color:#8b949e;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:Inter;">${d.body}</div>` : ''}
        <div style="font-size:11px;color:#6e7681;margin-top:3px;font-family:Inter;">${d.date}</div>
      </div>
      ${d.img ? `<img src="${d.img}" class="draft-thumb" alt="" onclick="event.stopPropagation()"/>` : ''}
      <button class="del-btn" onclick="event.stopPropagation();confirmDelete(${d.id})" aria-label="Delete">
        <span class="material-symbols-outlined text-red-400" style="font-size:18px">delete</span>
      </button>
    </div>
  `).join('');
}

function openDraft(id) {
  alert('Open draft #' + id);
}

function confirmDelete(id) {
  pendingDeleteId = id;
  document.getElementById('delete-confirm').style.display = 'flex';
}
function cancelDelete() {
  pendingDeleteId = null;
  document.getElementById('delete-confirm').style.display = 'none';
}
function doDelete() {
  drafts = drafts.filter(d => d.id !== pendingDeleteId);
  cancelDelete();
  render();
}

function confirmClearAll() {
  document.getElementById('clear-confirm').style.display = 'flex';
}
function cancelClear() {
  document.getElementById('clear-confirm').style.display = 'none';
}
function doClearAll() {
  drafts = [];
  cancelClear();
  render();
}

render();
</script>
</body>
</html>
