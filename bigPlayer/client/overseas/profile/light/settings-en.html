<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Settings — BigPlayer (EN)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-family:'Material Symbols Outlined';}

body{
  background:#d0d9de;
  display:flex;justify-content:center;align-items:flex-start;
  padding:40px 0 80px;min-height:100vh;
  font-family:Inter,sans-serif;
}

/* ── Phone shell ── */
.shell{
  width:375px;height:812px;
  background:#f7f9fb;
  border-radius:44px;
  box-shadow:0 0 0 10px #e0e5e8,0 0 0 12px #c8d0d5,0 36px 72px rgba(0,0,0,.18);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
.island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:124px;height:36px;background:#000;border-radius:20px;z-index:100;
}

/* ── Status bar ── */
.status-bar{
  height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 24px;flex-shrink:0;
  background:#f7f9fb;
}
.sb-time{font-family:Manrope;font-size:15px;font-weight:700;color:#1a2a34;}
.sb-icons{display:flex;align-items:center;gap:5px;}
.sb-icons .material-symbols-outlined{font-size:16px;color:#1a2a34;}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;
  padding:0 8px 0 4px;height:52px;
  background:#f7f9fb;flex-shrink:0;
  border-bottom:1px solid #e1e9ee;
}
.back-btn{
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;cursor:pointer;border:none;background:transparent;flex-shrink:0;
}
.back-btn:active{background:#e8eff3;}
.back-btn .material-symbols-outlined{font-size:22px;color:#566166;}
.topbar-title{
  flex:1;text-align:center;
  font-family:Manrope;font-size:17px;font-weight:800;color:#1a2a34;
  margin-right:40px; /* balance the back button */
}

/* ── Scroll body ── */
.body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  background:#eef2f5;
}
.body::-webkit-scrollbar{display:none;}

.content{padding:14px 12px;display:flex;flex-direction:column;gap:10px;}

/* ── Card group ── */
.card{
  background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 1px 4px rgba(42,52,57,.06);
}

/* ── Menu row ── */
.menu-row{
  display:flex;align-items:center;
  padding:0 16px;height:54px;
  cursor:pointer;
  transition:background .12s;
  border-bottom:1px solid #f0f4f7;
}
.menu-row:last-child{border-bottom:none;}
.menu-row:active{background:#f0f4f7;}

.menu-label{
  flex:1;font-size:15px;font-weight:500;color:#1a2a34;font-family:Inter;
}
.menu-sub{
  font-size:12px;font-weight:500;color:#0061a4;
  margin-right:6px;font-family:Inter;
}
.menu-chevron{
  font-size:20px;color:#c8d0d5;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}

/* ── Section label ── */
.section-label{
  font-size:11px;font-weight:600;color:#a9b4b9;
  font-family:Inter;letter-spacing:.6px;text-transform:uppercase;
  padding:0 4px 6px;
}

/* ── Toggle switch ── */
.toggle-wrap{position:relative;width:46px;height:28px;flex-shrink:0;cursor:pointer;}
.toggle-wrap input{opacity:0;width:0;height:0;position:absolute;}
.toggle-track{
  position:absolute;inset:0;border-radius:999px;
  background:#d0d9de;transition:background .22s;
}
.toggle-wrap input:checked + .toggle-track{background:#0061a4;}
.toggle-knob{
  position:absolute;top:3px;left:3px;
  width:22px;height:22px;border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.20);
  transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
}
.toggle-wrap input:checked ~ .toggle-knob{transform:translateX(18px);}

/* ── Logout ── */
.logout-btn{
  display:block;width:100%;height:54px;
  background:#fff;border-radius:18px;border:none;
  font-size:15px;font-weight:600;color:#e53935;font-family:Inter;
  cursor:pointer;text-align:center;
  box-shadow:0 1px 4px rgba(42,52,57,.06);
  transition:background .12s;
}
.logout-btn:active{background:#fdf0f0;}

/* ── Account info pill ── */
.acct-pill{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  background:#fff;border-radius:18px;
  box-shadow:0 1px 4px rgba(42,52,57,.06);
  cursor:pointer;
  transition:background .12s;
}
.acct-pill:active{background:#f0f4f7;}
.acct-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;
  background:#c8d0d5;flex-shrink:0;
}
.acct-avatar img{width:100%;height:100%;object-fit:cover;}
.acct-info{flex:1;min-width:0;}
.acct-name{font-family:Manrope;font-size:15px;font-weight:800;color:#1a2a34;}
.acct-id{font-size:11px;color:#a9b4b9;font-family:Inter;margin-top:2px;}
.acct-chevron{font-size:20px;color:#c8d0d5;}
</style>
</head>
<body>

<div class="shell">
  <!-- Dynamic island -->
  <div class="island"></div>

  <!-- Status bar -->
  <div class="status-bar">
    <span class="sb-time">9:41</span>
    <div class="sb-icons">
      <span class="material-symbols-outlined">signal_cellular_alt</span>
      <span class="material-symbols-outlined">wifi</span>
      <span class="material-symbols-outlined">battery_5_bar</span>
    </div>
  </div>

  <!-- Top bar -->
  <div class="topbar">
    <button class="back-btn" onclick="location.href='profile-en.html'">
      <span class="material-symbols-outlined">arrow_back_ios</span>
    </button>
    <span class="topbar-title">Settings</span>
  </div>

  <!-- Scrollable body -->
  <div class="body">
    <div class="content">

      <!-- Notifications & Privacy -->
      <div class="section-label" style="margin-top:4px;">Notifications & Privacy</div>
      <div class="card">

        <!-- Notification settings -->
        <div class="menu-row" onclick="">
          <span class="menu-label">Notification Settings</span>
          <span class="menu-sub">Manage push alerts</span>
          <span class="material-symbols-outlined menu-chevron">chevron_right</span>
        </div>

        <!-- Blocked users -->
        <div class="menu-row" onclick="">
          <span class="menu-label">Blocked Users</span>
          <span class="material-symbols-outlined menu-chevron">chevron_right</span>
        </div>

      </div>

      <!-- Display -->
      <div class="section-label" style="margin-top:4px;">Display</div>
      <div class="card">
        <div class="menu-row" style="cursor:default;">
          <span class="menu-label">Dark Mode</span>
          <label class="toggle-wrap">
            <input type="checkbox" id="dark-toggle" onchange="toggleDark(this)"/>
            <div class="toggle-track"></div>
            <div class="toggle-knob"></div>
          </label>
        </div>
      </div>

      <!-- More -->
      <div class="section-label" style="margin-top:4px;">More</div>
      <div class="card">
        <div class="menu-row" onclick="">
          <span class="menu-label">About BigPlayer</span>
          <span style="font-size:12px;color:#a9b4b9;font-family:Inter;margin-right:6px;">v3.1.0</span>
          <span class="material-symbols-outlined menu-chevron">chevron_right</span>
        </div>
      </div>

      <!-- Logout -->
      <button class="logout-btn" onclick="confirmLogout()">Log Out</button>

    </div>
  </div><!-- /body -->

</div><!-- /shell -->

<script>
function toggleDark(el) {
  if (el.checked) location.replace('../dark/settings-en-dark.html');
}
function confirmLogout() {
  // demo only
  alert('Log out?');
}
</script>
</body>
</html>
