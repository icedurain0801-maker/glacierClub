<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Post a Moment — X-Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:ital,wght@0,700;0,800;1,800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;font-family:'Material Symbols Outlined';}
body{background:#d0d9de;display:flex;justify-content:center;align-items:flex-start;padding:40px 0 80px;min-height:100vh;}
.shell{width:375px;height:812px;background:#f7f9fb;border-radius:44px;
  box-shadow:0 0 0 10px #e0e5e8,0 0 0 12px #c8d0d5,0 36px 72px rgba(0,0,0,.18);
  overflow:hidden;position:relative;display:flex;flex-direction:column;}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:124px;height:36px;background:#000;border-radius:20px;z-index:100;}

/* topbar */
.topbar{height:54px;background:#fff;border-bottom:1px solid #e1e9ee;
  display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;
  box-shadow:0 2px 4px rgba(0,97,164,.05);}
.tb-back{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;}
.tb-back .material-symbols-outlined{font-size:20px;color:#566166;}
.tb-drafts{font-size:12px;font-weight:600;color:#0061a4;font-family:Inter;cursor:pointer;background:transparent;border:none;}
.tb-title{flex:1;text-align:center;font-family:Manrope;font-size:15px;font-weight:800;color:#0061a4;}
.tb-save{font-size:12px;font-weight:600;color:#c8d0d5;font-family:Inter;cursor:not-allowed;background:transparent;border:none;white-space:nowrap;}
.tb-save.active{color:#566166;cursor:pointer;}
.tb-publish{height:28px;padding:0 14px;background:#0061a4;color:#fff;font-size:12px;font-weight:700;font-family:Inter;border-radius:14px;border:none;cursor:pointer;white-space:nowrap;}

/* body */
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
.body::-webkit-scrollbar{display:none;}

/* textarea */
.compose-area{padding:16px 16px 0;}
.compose-textarea{width:100%;border:none;background:transparent;outline:none;resize:none;
  font-family:Inter;font-size:15px;color:#1a2a34;line-height:1.6;min-height:120px;}
.compose-textarea::placeholder{color:#c8d0d5;}

/* media upload zone */
.upload-zone{margin:12px 16px;border:2px dashed #c8d0d5;border-radius:12px;
  height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;cursor:pointer;background:#f7f9fb;transition:border-color .15s,background .15s;}
.upload-zone:hover{border-color:#0061a4;background:#f0f6fc;}
.upload-zone-icon{width:48px;height:48px;background:rgba(0,97,164,.08);border-radius:50%;
  display:flex;align-items:center;justify-content:center;}
.upload-zone-icon .material-symbols-outlined{font-size:26px;color:#0061a4;}
.upload-zone-label{font-size:13px;font-weight:600;color:#2a3439;font-family:Inter;}
.upload-zone-sub{font-size:11px;color:#a9b4b9;font-family:Inter;}

/* preview grid */
#previewGrid{display:none;margin:12px 16px;gap:3px;border-radius:12px;overflow:hidden;}
#previewGrid.has-images{display:grid;}
.preview-item{position:relative;overflow:hidden;background:#e8edf0;}
.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover;display:block;}
.del-btn{position:absolute;top:4px;right:4px;width:20px;height:20px;background:rgba(0,0,0,.5);
  border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.del-btn .material-symbols-outlined{font-size:12px;color:#fff;}
.add-more-slot{border:2px dashed #c8d0d5;border-radius:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;background:#f0f4f7;transition:border-color .15s;}
.add-more-slot:hover{border-color:#0061a4;}
.add-more-slot .material-symbols-outlined{font-size:20px;color:#a9b4b9;}
.add-more-count{font-size:10px;color:#a9b4b9;font-family:Inter;}

/* tags */
.tags-section{padding:12px 16px 8px;border-top:1px solid #f0f4f7;margin-top:4px;}
.tags-label{font-size:12px;font-weight:700;color:#566166;font-family:Inter;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;}
.tag-chip{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;font-family:Inter;border:none;}
.tag-chip.on{background:#0061a4;color:#fff;}
.tag-chip.off{background:#eef2f5;color:#566166;}

/* section selector */
.section-bar{flex-shrink:0;background:#fff;border-top:1px solid #e1e9ee;padding:10px 14px;}
.section-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  background:#f0f4f7;border-radius:16px;border:none;cursor:pointer;font-family:Inter;}
.section-btn .material-symbols-outlined{font-size:15px;color:#a9b4b9;}
.section-btn-pre{font-size:11px;color:#a9b4b9;}
.section-btn-name{font-size:13px;font-weight:600;color:#2a3439;}
.section-btn .expand-icon{font-size:16px;color:#a9b4b9;}

/* toolbar */
.toolbar{flex-shrink:0;background:#fff;border-top:1px solid #e1e9ee;
  padding:8px 16px 12px;display:flex;justify-content:space-between;align-items:center;}
.tool-btn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;background:transparent;}
.tool-btn .material-symbols-outlined{font-size:22px;color:#566166;}
.tool-btn.active{background:rgba(0,97,164,.08);}
.tool-btn.active .material-symbols-outlined{color:#0061a4;}
</style>
</head>
<body>
<div class="shell">
  <div class="island"></div>

  <!-- Topbar -->
  <div class="topbar" style="margin-top:54px;">
    <button class="tb-back" onclick="location.href='../home/home-en.html'">
      <span class="material-symbols-outlined">arrow_back</span>
    </button>
    <button class="tb-drafts" onclick="location.href='drafts-en.html'">Drafts</button>
    <div class="tb-title">Post a Moment</div>
    <button class="tb-save" id="saveDraftBtn" disabled>Save Draft</button>
    <button class="tb-publish">Post</button>
  </div>

  <div class="body">
    <!-- Text input -->
    <div class="compose-area">
      <textarea class="compose-textarea" id="mainTextarea" placeholder="Share what's on your mind…" rows="5"
        oninput="updateSaveBtn()"></textarea>
    </div>

    <!-- Media upload -->
    <input type="file" id="fileInput" accept="image/*,video/*" multiple style="display:none" onchange="handleFiles(this.files)">
    <div class="upload-zone" id="mediaUploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-zone-icon">
        <span class="material-symbols-outlined">add_photo_alternate</span>
      </div>
      <div class="upload-zone-label">Add photos or videos</div>
      <div class="upload-zone-sub">Photos or videos · max 50 MB</div>
    </div>
    <div id="previewGrid"></div>

    <!-- Suggested topics -->
    <div class="tags-section">
      <div class="tags-label">Suggested Topics</div>
      <div class="tags-row">
        <button class="tag-chip on">#Screenshots</button>
        <button class="tag-chip off">#GuideTime</button>
        <button class="tag-chip off">#Community</button>
        <button class="tag-chip off">#DailyVibes</button>
        <button class="tag-chip off">+ Explore more</button>
      </div>
    </div>
  </div>

  <!-- Section selector -->
  <div class="section-bar">
    <button class="section-btn">
      <span class="material-symbols-outlined">grid_view</span>
      <span class="section-btn-pre">Section:</span>
      <span class="section-btn-name">Guides — Ancient Secrets</span>
      <span class="material-symbols-outlined expand-icon">unfold_more</span>
    </button>
  </div>

  <!-- Formatting toolbar -->
  <div class="toolbar">
    <button class="tool-btn active">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24">mood</span>
    </button>
    <button class="tool-btn" onclick="document.getElementById('fileInput').click()">
      <span class="material-symbols-outlined">image</span>
    </button>
    <button class="tool-btn">
      <span class="material-symbols-outlined">crop_free</span>
    </button>
    <button class="tool-btn">
      <span class="material-symbols-outlined">insert_chart</span>
    </button>
    <button class="tool-btn">
      <span class="material-symbols-outlined">alternate_email</span>
    </button>
  </div>
</div>

<script>
const MAX_FILES = 9;
let mediaFiles = [];

function handleFiles(fileList) {
  const incoming = Array.from(fileList).filter(f => f.size <= 50 * 1024 * 1024);
  const remaining = MAX_FILES - mediaFiles.length;
  mediaFiles = mediaFiles.concat(incoming.slice(0, remaining));
  renderPreviews();
  updateSaveBtn();
}

function removeFile(idx) {
  mediaFiles.splice(idx, 1);
  renderPreviews();
  updateSaveBtn();
}

function renderPreviews() {
  const grid = document.getElementById('previewGrid');
  const zone = document.getElementById('mediaUploadZone');
  if (mediaFiles.length === 0) {
    grid.innerHTML = '';
    grid.classList.remove('has-images');
    zone.style.display = '';
    return;
  }
  zone.style.display = 'none';
  grid.classList.add('has-images');
  const cols = mediaFiles.length === 1 ? 1 : mediaFiles.length === 2 ? 2 : 3;
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const cellH = mediaFiles.length === 1 ? '200px' : '110px';
  let html = mediaFiles.map((f, i) => {
    const url = URL.createObjectURL(f);
    const isVideo = f.type.startsWith('video/');
    const media = isVideo
      ? `<video src="${url}" muted playsinline style="pointer-events:none"></video>`
      : `<img src="${url}" alt="">`;
    return `<div class="preview-item" style="height:${cellH}">${media}<div class="del-btn" onclick="removeFile(${i})"><span class="material-symbols-outlined">close</span></div></div>`;
  }).join('');
  if (mediaFiles.length < MAX_FILES) {
    html += `<div class="add-more-slot" style="height:${cellH}" onclick="document.getElementById('fileInput').click()"><span class="material-symbols-outlined">add</span><span class="add-more-count">${mediaFiles.length}/${MAX_FILES}</span></div>`;
  }
  grid.innerHTML = html;
}

function updateSaveBtn() {
  const btn = document.getElementById('saveDraftBtn');
  const hasContent = document.getElementById('mainTextarea').value.trim().length > 0 || mediaFiles.length > 0;
  btn.disabled = !hasContent;
  btn.className = hasContent ? 'tb-save active' : 'tb-save';
}
</script>
</body>
</html>
