<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

  }
  body { min-height: 100dvh; }
  .phone-shell { width: 375px; flex-shrink: 0; }
  .phone-inner {
    width: 375px; height: 812px;
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }
  @media (max-width: 430px) {
    body { background: #f7f9fb; align-items: flex-start; }
    .phone-shell { width: 100vw; margin: 0 !important; border-radius: 0 !important; box-shadow: none !important; position: static !important; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Dynamic Island */
  .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; background: #000; border-radius: 20px; z-index: 100; }

  /* Status bar */
  .status-bar {
    height: 54px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
    flex-shrink: 0; position: relative; z-index: 2;
  }
  .sb-time { font-family: Manrope, sans-serif; font-size: 15px; font-weight: 700; }
  .sb-icons { display: flex; align-items: center; gap: 5px; }

  /* Blue gradient top */
  .search-top {
    background: linear-gradient(175deg, #003d7a 0%, #0061a4 55%, #1a7fc4 100%);
    padding: 0 16px 28px;
    flex-shrink: 0;
  }
  .back-row {
    display: flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,0.75);
    font-size: 14px; font-weight: 500;
    margin-bottom: 18px; cursor: pointer;
  }
  .back-row .material-symbols-outlined { font-size: 20px; color: rgba(255,255,255,0.75); }
  .input-glass {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 14px; padding: 10px 14px;
  }
  .input-glass .material-symbols-outlined { color: rgba(255,255,255,0.65); font-size: 20px; }
  .input-glass input {
    flex: 1; background: transparent; border: none; outline: none;
    font-size: 14px; font-family: Inter, sans-serif; color: #ffffff;
    -webkit-appearance: none;
  }
  .input-glass input::placeholder { color: rgba(255,255,255,0.45); }
  .input-glass input::-webkit-search-cancel-button { display: none; }

  /* Results area */
  .results-body {
    background: #f7f9fb;
    border-radius: 22px 22px 0 0;
    margin-top: -16px;
    flex: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #e1e9ee;
    background: #fff;
    border-radius: 22px 22px 0 0;
    flex-shrink: 0;
  }
  .tab-item {
    flex: 1; text-align: center;
    font-size: 13px; font-weight: 500; color: #566166;
    padding: 13px 0;
    border-bottom: 2px solid transparent;
    cursor: pointer; transition: color 0.15s;
  }
  .tab-item.active { font-weight: 700; color: #1f2937; border-bottom: 2px solid #0061a4; }
  .tab-panel { display: none; flex: 1; overflow-y: auto; }
  .tab-panel.active { display: flex; flex-direction: column; padding-top: 10px; }
  .tab-panel::-webkit-scrollbar { display: none; }

  /* Result card */
  .result-card {
    background: #fff; border-radius: 10px;
    padding: 14px; margin: 0 12px 12px;
    box-shadow: 0 4px 16px rgba(42,52,57,0.07);
    flex-shrink: 0;
  }
  .card-user-row {
    display: flex; align-items: center;
    justify-content: space-between; margin-bottom: 12px;
  }
  .card-user-left { display: flex; align-items: center; gap: 10px; }
  .card-avatar-wrap { position: relative; }
  .card-avatar {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #93c5fd, #3b82f6);
  }
  .card-avatar.official { background: linear-gradient(135deg, #bae6fd, #0284c7); }

  /* Follow button */
  .follow-btn {
    padding: 6px 16px; border-radius: 999px;
    background: #cbe6ff; color: #0a5780;
    font-size: 12px; font-weight: 700;
    border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    font-family: Inter, sans-serif;
  }

  /* User strip (All tab) */
  .user-strip {
    display: flex; gap: 12px;
    overflow-x: auto; padding: 0 14px 12px;
    flex-shrink: 0;
  }
  .user-strip::-webkit-scrollbar { display: none; }
  .user-strip-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; }
  .strip-ring {

    background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);

  .strip-follow-btn {
    position: absolute; bottom: -1px; right: -1px;
    width: 18px; height: 18px; border-radius: 50%;

    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 11px; font-weight: 700; color: #fff; line-height: 1;

  /* Section title */
  .section-title {
    font-size: 12px; font-weight: 700; color: #0061a4;
    padding: 4px 14px 8px;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .section-count { font-size: 11px; font-weight: 400; color: #a9b4b9; }

  /* User list row */
  .user-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid #f0f4f7;

  .user-row:last-child { border-bottom: none; }

  .user-info { flex: 1; min-width: 0; }

  .user-sub { font-size: 11px; color: #a9b4b9; margin-top: 2px; }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 24px 24px; text-align: center;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .45; }
  .empty-title { font-size: 15px; font-weight: 600; color: #566166; margin-bottom: 6px; }
  .empty-sub { font-size: 13px; color: #a9b4b9; }
  .hot-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
  .hot-chip { background: #e8f0fb; color: #0061a4; font-size: 12px; border-radius: 999px; padding: 5px 12px; cursor: pointer; }

  /* Bottom nav */

    height: 82px; background: rgba(255,255,255,.96);

    display: flex; align-items: flex-start; padding-top: 8px; flex-shrink: 0;

  .bi-label { font-size: 10px; color: #a9b4b9; font-weight: 500; font-family: Inter, sans-serif; }
  .bi.on .bi-label { color: #0061a4; }
  .bpub { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  .bpub-btn { width: 46px; height: 46px; background: #0061a4; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0,97,164,.35); margin-top: -10px; }
  .bpub-btn .material-symbols-outlined { font-size: 22px; color: #fff; }

  document.querySelectorAll('.tab-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.id === 'panel-' + tab));
}

const HOT_KEYWORDS = ['StarSpirit', 'Soul Hunter', 'Season 5', 'Guild Recruitment', 'Beginner Guide', 'Blazing Phoenix', 'Super League', 'Gear Enhancement'];

function postCardHTML(post) {
  const avatarClass = post.official ? 'card-avatar official' : 'card-avatar';
  const lvNum = parseInt((post.level || 'lv1').replace('lv','')) || 1;
  const badgeRow = post.official
    ? `<div class="card-badge-row"><span class="official-badge"><span class="material-symbols-outlined">verified</span>Official</span><span class="card-time">${post.time}</span></div>`
    : `<div class="card-badge-row"><span class="card-time">${post.time}</span></div>`;
  const imageHTML = post.hasImage
    ? `<div class="card-single-img" style="background:${post.imageBg};">${post.imageLabel}</div>`
    : '';
  return `
    <div class="result-card">
      <div class="card-user-row">
        <div class="card-user-left">
          <div class="card-avatar-wrap">
            <img class="${avatarClass}" src="${post.avatar}" alt="${post.username}" style="object-fit:cover;cursor:pointer;" onclick="event.stopPropagation();location.href='../../profile/light/profile-other-en.html'"/>
            <div class="card-online-dot"></div>
          </div>
          <div class="card-user-info">
            <div class="card-name-row">
              <span class="card-username">${post.username}</span>
              <span class="card-lv">LV.${lvNum}</span>
            </div>
            ${badgeRow}
          </div>
        </div>
        <button class="follow-btn">Follow</button>
      </div>
      <div class="card-body"><p>${post.text}</p>${imageHTML}</div>
      <div class="card-stats">
        <div class="card-stats-item"><span class="material-symbols-outlined">thumb_up</span><span>${post.likes}</span></div>
        <div class="card-stats-item"><span class="material-symbols-outlined">chat_bubble</span><span>${post.comments}</span></div>
        <div class="card-stats-item"><span class="material-symbols-outlined">share</span><span>Share</span></div>
      </div>
    </div>`;
}

function emptyStateHTML() {

  return `
    <div class="empty-state">
      <div class="empty-icon">🔍</div>
      <div class="empty-title">No results found</div>
      <div class="empty-sub">Try a different keyword?</div>
    </div>
    <div class="section-title">Trending Searches</div>
    <div class="hot-chips">${chips}</div>`;
}

function userStripHTML() {
  const items = MOCK_USERS.slice(0, 6).map(u => `
    <div class="user-strip-item">
      <div class="strip-ring">
        <img src="${u.avatar}" alt="${u.username}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;cursor:pointer;" onclick="location.href='../../profile/light/profile-other-en.html'"/>
        <button class="strip-follow-btn" onclick="this.textContent=this.textContent==='+'?'✓':'+';this.style.background=this.textContent==='✓'?'#22c55e':'#0061a4'">+</button>
      </div>
      <span class="strip-name">${u.username}</span>
    </div>`).join('');
  return `<div class="section-title">Related Users</div><div class="user-strip">${items}</div>`;
}

function renderAll() {
  if (query.toLowerCase().includes('empty')) {
    ['all','posts','users'].forEach(id => document.getElementById('panel-'+id).innerHTML = emptyStateHTML());
    return;
  }
  let html = userStripHTML();
  if (MOCK_POSTS.length) {
    html += `<div class="section-title">Related Posts</div>`;
    html += MOCK_POSTS.map(postCardHTML).join('');
  }
  document.getElementById('panel-all').innerHTML = html || emptyStateHTML();
}

function renderPosts() {
  if (query.toLowerCase().includes('empty')) return;
  const official = MOCK_POSTS.filter(p => p.official);
  const community = MOCK_POSTS.filter(p => !p.official);
  let html = '';
  if (official.length) html += `<div class="section-title">Official Posts <span class="section-count">${official.length} results</span></div>` + official.map(postCardHTML).join('');
  if (community.length) html += `<div class="section-title">Community Posts <span class="section-count">${community.length} results</span></div>` + community.map(postCardHTML).join('');
  document.getElementById('panel-posts').innerHTML = html || emptyStateHTML();
}

function renderUsers() {
  if (query.toLowerCase().includes('empty')) return;
  const rows = MOCK_USERS.map(u => `
    <div class="user-row">
      <img class="user-avatar" src="${u.avatar}" alt="${u.username}" style="object-fit:cover;cursor:pointer;" onclick="location.href='../../profile/light/profile-other-en.html'"/>
      <div class="user-info">
        <div class="user-name">${u.username}</div>
        <div class="user-sub">${u.level} · ${u.followers} followers</div>
      </div>
      <button class="follow-btn">Follow</button>
    </div>`).join('');
  document.getElementById('panel-users').innerHTML = rows || emptyStateHTML();
}

renderAll();
renderPosts();
renderUsers();
</script>
</body>
</html>
