<style data-purpose="custom-utilities">
    /* Hide scrollbar for clean look */
    ::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .safe-area-pb {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
    /* Simple glass effect */
    .glass-nav {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    /* 每个 slide 宽度 = wrapper 宽度的 84%，两侧各留 8% 供旁边 slide 漏出 */
    .carousel-slide {
      width: 84%;
    }
    /* 中间激活 slide 的内层容器不缩放、不降低透明度 */
    .carousel-slide.active > div {
      opacity: 1 !important;
      transform: scale(1) !important;
    }
    /* 非激活 slide */
    .carousel-slide:not(.active) > div {
      opacity: 0.65;
      transform: scale(0.93);
    }
    /* 高斯模糊背景图 */
    #carousel-bg {
      filter: blur(20px) brightness(0.7);
      transform: scale(1.15);
      transition: opacity 0.6s ease-in-out;
    }
  </style>
</head>

<script>
(function () {
  const TOTAL = 3;
  const INTERVAL = 3000;
  const TRANSITION = 500;

  const wrapper = document.getElementById('carousel-wrapper');
  const track = document.getElementById('carousel-track');
  const slides = track.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('#carousel-dots [data-dot]');
  const bgEl = document.getElementById('carousel-bg');

  // 真实图片 src 数组（顺序对应 realIndex 0/1/2）
  const bgSrcs = Array.from(
    document.querySelectorAll('#carousel-track .carousel-slide img[alt^="Hero Banner"]')
  ).filter((img, i) => i >= 1 && i <= 3).map(img => img.src);

  let realIndex = 0;
  let isTransitioning = false;

  function slideWidth() {
    return slides[0].getBoundingClientRect().width;
  }

  function goTo(trackIndex, animate) {
    if (!animate) {
      track.style.transition = 'none';
    } else {
      track.style.transition = `transform ${TRANSITION}ms ease-in-out`;
    }
    const ww = wrapper.getBoundingClientRect().width;
    const sw = slideWidth();
    const offset = -(trackIndex * sw) + (ww - sw) / 2;
    track.style.transform = `translateX(${offset}px)`;
  }

  function updateDots(idx) {
    dots.forEach((d, i) => {
      if (i === idx) {
        d.classList.remove('bg-white/50', 'w-1.5');
        d.classList.add('bg-white', 'w-4');
      } else {
        d.classList.remove('bg-white', 'w-4');
        d.classList.add('bg-white/50', 'w-1.5');
      }
    });
  }

  function updateActiveSlide(trackIndex) {
    slides.forEach((s, i) => {
      if (i === trackIndex) {
        s.classList.add('active');
      } else {
        s.classList.remove('active');
      }
    });
  }

  function updateBg(idx) {
    if (!bgEl || !bgSrcs[idx]) return;
    bgEl.style.opacity = '0';
    setTimeout(() => {
      bgEl.src = bgSrcs[idx];
      bgEl.style.opacity = '1';
    }, 300);
  }

  function init() {
    goTo(1, false);
    updateActiveSlide(1);
    updateDots(0);
    // 背景初始无需淡入
    if (bgEl && bgSrcs[0]) bgEl.src = bgSrcs[0];
  }

  function next() {
    if (isTransitioning) return;
    isTransitioning = true;

    const nextReal = realIndex + 1;
    const nextTrack = nextReal + 1;

    goTo(nextTrack, true);
    updateActiveSlide(nextTrack);

    setTimeout(() => {
      if (nextReal >= TOTAL) {
        goTo(1, false);
        updateActiveSlide(1);
        realIndex = 0;
      } else {
        realIndex = nextReal;
      }
      updateDots(realIndex);
      updateBg(realIndex);
      isTransitioning = false;
    }, TRANSITION + 50);
  }

  init();

  // 等待两帧确保初始无动画跳位已完成，再恢复过渡效果
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      track.style.transition = `transform ${TRANSITION}ms ease-in-out`;
    });
  });

  let timer = setInterval(next, INTERVAL);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearInterval(timer);
    } else {
      timer = setInterval(next, INTERVAL);
    }
  });
})();

// Tab switching
(function () {
  const tabBtns = document.querySelectorAll('[data-tab]');
  const tabPanels = document.querySelectorAll('.tab-panel');

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;

      tabBtns.forEach(b => {
        const isActive = b.dataset.tab === target;
        b.classList.toggle('font-bold', isActive);
        b.classList.toggle('text-white/70', !isActive);
        b.querySelector('.tab-indicator').classList.toggle('opacity-0', !isActive);
      });

      tabPanels.forEach(panel => {
        const isActive = panel.id === 'tab-' + target;
        panel.classList.toggle('opacity-0', !isActive);
        panel.classList.toggle('pointer-events-none', !isActive);
      });
    });
  });
})();
</script>
</body></html>
