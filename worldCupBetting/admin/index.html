<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC2026 管理后台 · 登录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(135deg,#E8F1FF,#C5D7F8);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:40px;width:360px;box-shadow:0 24px 60px rgba(22,89,229,.15)}
.logo{text-align:center;margin-bottom:28px}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#1659E5,#0C3FB0);color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:.05em}
h1{font-size:22px;font-weight:800;color:#0B1B3D;text-align:center;margin-bottom:6px}
.sub{text-align:center;font-size:13px;color:#6B7E9E;margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:#4A5568;margin-bottom:6px}
input{width:100%;border:1.5px solid #E3EAF5;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;transition:border-color .15s}
input:focus{border-color:#1659E5}
.btn{width:100%;background:linear-gradient(180deg,#1659E5,#0C3FB0);color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;margin-top:8px}
.btn:hover{opacity:.9}
.error{color:#E53E3E;font-size:13px;text-align:center;margin-top:12px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-badge">⚽ WC2026 管理后台</div>
  </div>
  <h1>管理员登录</h1>
  <p class="sub">仅限管理员账号访问</p>
  <form id="loginForm">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" placeholder="admin" autocomplete="username" required/>
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button class="btn" type="submit">登 录</button>
    <div class="error" id="errMsg"></div>
  </form>
</div>
<script>
const API = 'http://localhost:3000/api';
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('.btn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  document.getElementById('errMsg').textContent = '';

  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '登录失败');
    if (data.user.role !== 'admin') throw new Error('非管理员账号');
    localStorage.setItem('wc_admin_token', data.token);
    localStorage.setItem('wc_admin_user', JSON.stringify(data.user));
    location.href = 'dashboard.html';
  } catch (err) {
    document.getElementById('errMsg').textContent = err.message;
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
