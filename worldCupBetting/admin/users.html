<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>用户管理 · WC2026 管理</title>
<link rel="stylesheet" href="_admin.css"/>
</head>
<body>
<div id="nav"></div>
<div class="container">
  <div class="page-title">用户管理</div>
  <div class="card">
    <div class="toolbar">
      <input type="text" id="searchQ" placeholder="搜索用户名/昵称" style="width:220px"/>
      <button class="btn btn-outline" onclick="loadUsers(1)">搜索</button>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>用户名</th><th>昵称</th><th>积分</th><th>连胜</th><th>角色</th><th>注册时间</th><th>操作</th></tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
    <div id="userPager"></div>
  </div>
</div>

<!-- 调整积分弹窗 -->
<div class="modal-overlay" id="pointsModal">
  <div class="modal">
    <h2>调整积分 · <span id="pointsUserName"></span></h2>
    <div class="form-row">
      <label>变动量（正数增加，负数扣减）</label>
      <input type="number" id="pointsDelta" placeholder="如 100 或 -50"/>
    </div>
    <div class="form-row">
      <label>原因（将记入流水）</label>
      <input type="text" id="pointsReason" placeholder="活动奖励/违规扣除"/>
    </div>
    <div class="msg" id="pointsMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('pointsModal')">取消</button>
      <button class="btn btn-primary" onclick="submitPoints()">确认</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="_layout.js"></script>
<script>
requireAdmin();
injectNav('users');

let currentUserId = null;
let currentPage = 1;

async function loadUsers(page = 1) {
  currentPage = page;
  const q = document.getElementById('searchQ').value.trim();
  const params = new URLSearchParams({ page });
  if (q) params.set('q', q);

  try {
    const data = await apiFetch('/admin/users?' + params);
    document.getElementById('userTable').innerHTML = data.data.map(u => `
      <tr>
        <td style="color:#6B7E9E;font-size:12px">${u.id}</td>
        <td>${u.username}</td>
        <td>${u.nickname}</td>
        <td style="font-weight:700;color:#1659E5">${u.points}</td>
        <td>${u.streak}</td>
        <td><span class="tag ${u.role==='admin'?'tag-pending':'tag-finished'}">${u.role}</span></td>
        <td style="font-size:12px;color:#6B7E9E">${u.created_at?u.created_at.slice(0,10):''}</td>
        <td><button class="btn btn-outline btn-sm" onclick="openPoints(${u.id},'${u.nickname}')">调整积分</button></td>
      </tr>
    `).join('') || '<tr><td colspan="8" style="text-align:center;color:#6B7E9E;padding:20px">暂无数据</td></tr>';

    renderPager(document.getElementById('userPager'), data.total, page, data.limit, loadUsers);
  } catch(e) {
    alert(e.message);
  }
}

function openPoints(id, name) {
  currentUserId = id;
  document.getElementById('pointsUserName').textContent = name;
  document.getElementById('pointsDelta').value = '';
  document.getElementById('pointsReason').value = '';
  document.getElementById('pointsMsg').textContent = '';
  document.getElementById('pointsMsg').className = 'msg';
  document.getElementById('pointsModal').classList.add('open');
}

async function submitPoints() {
  const delta  = parseInt(document.getElementById('pointsDelta').value);
  const reason = document.getElementById('pointsReason').value.trim();
  if (isNaN(delta) || delta === 0) { showMsg('pointsMsg', '请输入有效变动量', 'error'); return; }
  if (!reason) { showMsg('pointsMsg', '请填写原因', 'error'); return; }
  try {
    const data = await apiFetch(`/admin/users/${currentUserId}/points`, {
      method: 'POST', body: { delta, reason }
    });
    showMsg('pointsMsg', `调整成功，当前积分：${data.points}`, 'success');
    setTimeout(() => { closeModal('pointsModal'); loadUsers(currentPage); }, 800);
  } catch(e) { showMsg('pointsMsg', e.message, 'error'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type;
}

loadUsers(1);
</script>
</body>
</html>
