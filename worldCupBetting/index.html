<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2026 World Cup Predict</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 项目设计文档 / 桌面端展示用容器 -->
  <div id="app-shell">
    <!-- 中：手机预览 -->
    <main class="phone-stage">
      <div class="phone-frame">
        <div class="phone-screen">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <span class="status-island"></span>
            <span class="status-icons">
              <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".5"/><rect x="4.5" y="5" width="3" height="6" rx=".5"/><rect x="9" y="3" width="3" height="8" rx=".5"/><rect x="13.5" y="0" width="3" height="11" rx=".5"/></svg>
              <svg width="15" height="11" viewBox="0 0 15 11" fill="currentColor"><path d="M7.5 10.5a1 1 0 100-2 1 1 0 000 2z"/><path d="M3 6.5a6 6 0 019 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M1 3.5a10 10 0 0113 0" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.7"/></svg>
              <svg width="26" height="11" viewBox="0 0 26 11"><rect x=".5" y=".5" width="22" height="10" rx="2.5" stroke="currentColor" fill="none" opacity=".5"/><rect x="2" y="2" width="19" height="7" rx="1.5" fill="currentColor"/><rect x="23" y="3.5" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg>
            </span>
          </div>
          <div class="phone-content" id="phone-content">
            <!-- JS 注入页面 -->
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="data/fixtures.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
