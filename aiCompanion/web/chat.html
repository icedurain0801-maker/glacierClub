<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
  <title>AI 陪伴机器人</title>
  <link rel="icon" type="image/svg+xml" href="favicon-chat.svg?v=20260716-links">
  <link rel="stylesheet" href="css/style.css?v=20260716-links">
</head>
<body class="chat-page">
  <canvas class="chat-page-bg" id="chat-page-bg"></canvas>
  <div class="chat-shell">
    <div class="chat-header">
      <button class="back" id="chat-back" type="button" aria-label="返回">&#8592;</button>
      <div class="avatar" id="chat-avatar">AI</div>
      <div class="title-block">
        <span id="chat-title">陪玩助手</span>
        <span class="status-line">在线</span>
      </div>
      <div class="header-actions" aria-hidden="true">
        <span>&#128206;</span><span>&#128247;</span><span>&#9788;</span>
      </div>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-empty" id="chat-empty">加载中...</div>
    </div>
    <div class="chat-input">
      <div class="emoji-panel" id="emoji-panel"></div>
      <div class="chat-input-row1">
        <button class="momo-emoji-btn" id="chat-emoji-btn" type="button" title="表情">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9" y2="9.5"/><line x1="15" y1="9" x2="15" y2="9.5"/></svg>
        </button>
        <textarea id="chat-input" placeholder="说点什么…" rows="1"></textarea>
        <button id="chat-send" title="发送">&#10148;</button>
      </div>
      <div class="chat-input-row2">
        <button class="momo-tool-btn momo-img" id="chat-image-btn" type="button" title="图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <button class="momo-tool-btn momo-vid" id="chat-video-btn" type="button" title="视频">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
        </button>
      </div>
      <div class="chat-input-preview" id="chat-input-preview"></div>
    </div>
    <input type="file" id="chat-file-image" accept="image/*" hidden>
    <input type="file" id="chat-file-video" accept="video/*" hidden>
  </div>
  <script src="js/chat.js?v=20260716-links"></script>
</body>
</html>
