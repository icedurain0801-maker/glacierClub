<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0,user-scalable=no">
  <title>AI 陪伴机器人</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230084ff'/%3E%3Cstop offset='1' stop-color='%2300c6ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Cpath d='M18 26a14 14 0 0 1 28 0c0 5-2.5 8.8-6 11.3V44l-6.5-3.6c-.5.05-1 .1-1.5.1a14 14 0 0 1-14-14.5z' fill='white' fill-opacity='.95'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-page">
  <div class="chat-shell">
    <div class="chat-header">
      <span class="back">‹</span>
      <div class="avatar" id="chat-avatar">AI</div>
      <div class="title-block">
        <span id="chat-title">陪玩助手</span>
        <span class="status-line">在线</span>
      </div>
      <div class="header-actions">
        <span>📞</span><span>📹</span><span>ⓘ</span>
      </div>
    </div>
    <div class="chat-body" id="chat-body">
      <div class="chat-empty" id="chat-empty">加载中…</div>
    </div>
    <div class="chat-input">
      <div class="chat-input-row1">
        <textarea id="chat-input" placeholder="Aa" rows="1"></textarea>
        <button id="chat-send" title="发送">➤</button>
      </div>
      <div class="chat-input-row2">
        <span class="input-icon">✚</span>
        <span class="input-icon">📷</span>
        <span class="input-icon">🎤</span>
        <span class="input-icon">😊</span>
      </div>
    </div>
  </div>
  <script src="js/chat.js"></script>
</body>
</html>
