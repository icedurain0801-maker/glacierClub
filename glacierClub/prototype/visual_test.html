<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>可视化测试 - 妖神记社区（375x667）</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin:20px; background:#f4f6f8; color:#2c3e50 }
    .container { display:flex; gap:20px; align-items:flex-start }
    .panel { background:#fff; padding:12px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.06) }
    .controls { width:220px }
    .controls button { display:block; width:100%; margin-bottom:8px; padding:8px 10px; border-radius:6px; border:1px solid #e6e9ec; background:#fff; cursor:pointer }
    .controls p { font-size:13px; color:#666 }
    .viewport { width:375px; height:667px; border:1px solid #dfe6ea; overflow:hidden; border-radius:12px }
    iframe { width:375px; height:667px; border:0; display:block }
    .hint { font-size:12px; color:#888; margin-top:8px }
  </style>
</head>
<body>
  <h3>可视化测试（固定视口 375×667）</h3>
  <div class="container">
    <div class="panel controls">
      <strong>步骤</strong>
      <p>点击下面按钮在iframe内切换页面，使用浏览器开发者工具切换为375宽设备（或直接在此iframe中截图）。</p>
      <button onclick="navigate('home')">🏠 首页 (Home)</button>
      <button onclick="navigate('news')">📰 资讯 (News)</button>
      <button onclick="openNewsDetail()">🔎 资讯详情 (News Detail)</button>
      <button onclick="navigate('posts')">👥 玩家圈 (Posts)</button>
      <button onclick="openPostDetail()">🔎 帖子详情 (Post Detail)</button>
      <button onclick="navigate('publish')">✏️ 发布帖子 (Publish)</button>
      <button onclick="navigate('profile')">👤 我的 (Profile)</button>
      <div class="hint">截图说明：在DevTools设备模式选择 375×667，或直接用系统截图工具对右侧视口截图。</div>
    </div>

    <div class="panel">
      <div class="viewport">
        <iframe id="appFrame" src="index.html" onload="onFrameLoad()"></iframe>
      </div>
      <div class="hint">提示：若第一次切换未生效，请在右上角刷新iframe后重试。</div>
    </div>
  </div>

  <script>
    const iframe = document.getElementById('appFrame');
    function onFrameLoad(){ /* 保持空，供future扩展 */ }

    function runInFrame(fn){
      try{
        const doc = iframe.contentWindow.document;
        if(!doc) return false;
        fn(doc);
        return true;
      }catch(e){
        console.warn('无法访问iframe内容，稍候重试', e);
        return false;
      }
    }

    function navigate(page){
      // 尝试通过触发nav-item点击来导航（SPA内部路由）
      const ok = runInFrame(doc => {
        const el = doc.querySelector('.nav-item[data-page="'+page+'"]');
        if(el){ el.click(); return; }
        // 备选：设置 location.hash
        const body = doc.querySelector('body');
        if(body) window.console.log('nav element not found in iframe');
      });
      if(!ok) { /* 如果跨域或未就绪，重置src并稍后尝试 */
        iframe.src = 'index.html';
        setTimeout(()=>navigate(page), 300);
      }
    }

    function openNewsDetail(){
      // 打开第一篇资讯详情
      const ok = runInFrame(doc => {
        const first = doc.querySelector('.news-item, .item-card, .item-list .item-card');
        if(first) first.click();
      });
      if(!ok){ iframe.src='index.html'; setTimeout(openNewsDetail, 300); }
    }

    function openPostDetail(){
      const ok = runInFrame(doc => {
        const first = doc.querySelector('.post-item, .item-card, .item-list .item-card');
        if(first) first.click();
      });
      if(!ok){ iframe.src='index.html'; setTimeout(openPostDetail, 300); }
    }
  </script>
</body>
</html>
