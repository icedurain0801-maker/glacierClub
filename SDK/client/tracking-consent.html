<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>选择账号 · 游戏体验</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0a1a; }
  #root { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ──────────────────────────────────────────
   IosFrame — 来自 huashu-design/assets/ios_frame.jsx
   ────────────────────────────────────────── */
const iosFrameStyles = {
  wrapper: {
    display: 'inline-block',
    padding: 12,
    background: '#000',
    borderRadius: 60,
    boxShadow: '0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.5)',
    position: 'relative',
  },
  screen: {
    position: 'relative',
    borderRadius: 48,
    overflow: 'hidden',
    background: '#fff',
  },
  statusBar: {
    position: 'absolute',
    top: 0, left: 0, right: 0,
    height: 54,
    display: 'flex',
    alignItems: 'center',
    justifyContent: 'space-between',
    padding: '0 32px',
    fontSize: 16,
    fontWeight: 600,
    fontFamily: '-apple-system, "SF Pro Text", sans-serif',
    zIndex: 20,
    pointerEvents: 'none',
  },
  dynamicIsland: {
    position: 'absolute',
    top: 12, left: '50%',
    transform: 'translateX(-50%)',
    width: 124, height: 36,
    background: '#000',
    borderRadius: 999,
    zIndex: 30,
  },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: {
    width: 26, height: 12,
    border: '1.5px solid currentColor',
    borderRadius: 3, padding: 1,
    position: 'relative', opacity: 0.8,
  },
  batteryCap: {
    position: 'absolute', top: 3, right: -3,
    width: 2, height: 6,
    background: 'currentColor',
    borderRadius: '0 1px 1px 0',
  },
  content: {
    position: 'absolute',
    top: 54, left: 0, right: 0, bottom: 34,
    overflow: 'auto',
  },
  homeIndicator: {
    position: 'absolute',
    bottom: 10, left: '50%',
    transform: 'translateX(-50%)',
    width: 140, height: 5,
    background: 'rgba(255,255,255,0.4)',
    borderRadius: 999,
    zIndex: 10,
  },
};

function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 87 }) {
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height }}>
        {/* 状态栏 */}
        <div style={{ ...iosFrameStyles.statusBar, color: '#fff' }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="white" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="white" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="white" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={{ ...iosFrameStyles.batteryIcon, borderColor: 'rgba(255,255,255,0.8)' }}>
              <div style={{
                width: `${battery}%`, height: '100%',
                background: 'white', borderRadius: 1, opacity: 0.9,
              }} />
              <div style={{ ...iosFrameStyles.batteryCap, background: 'white' }} />
            </div>
          </div>
        </div>

        {/* 灵动岛 */}
        <div style={iosFrameStyles.dynamicIsland} />

        {/* 内容区 */}
        <div style={iosFrameStyles.content}>
          {children}
        </div>

        {/* Home Indicator */}
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

/* ──────────────────────────────────────────
   游戏场景背景
   ────────────────────────────────────────── */
function GameBackground() {
  return (
    <div style={{
      position: 'absolute',
      inset: 0,
      background: `
        radial-gradient(ellipse 80% 60% at 50% 30%, #3b1f6e 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 30% 60%, #1a1050 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 70% 70%, #0d2a5e 0%, transparent 60%),
        linear-gradient(180deg, #1a0a3d 0%, #0a1030 40%, #050820 100%)
      `,
      overflow: 'hidden',
    }}>
      {/* 魔法粒子光效 */}
      {[
        { x: '20%', y: '25%', size: 180, color: 'rgba(100,60,220,0.25)', blur: 60 },
        { x: '70%', y: '15%', size: 140, color: 'rgba(40,120,255,0.2)', blur: 50 },
        { x: '50%', y: '45%', size: 220, color: 'rgba(80,40,180,0.15)', blur: 80 },
        { x: '15%', y: '65%', size: 100, color: 'rgba(60,180,255,0.15)', blur: 40 },
        { x: '80%', y: '55%', size: 120, color: 'rgba(160,80,255,0.2)', blur: 45 },
      ].map((orb, i) => (
        <div key={i} style={{
          position: 'absolute',
          left: orb.x, top: orb.y,
          transform: 'translate(-50%, -50%)',
          width: orb.size, height: orb.size,
          background: orb.color,
          borderRadius: '50%',
          filter: `blur(${orb.blur}px)`,
        }} />
      ))}

      {/* 英雄剪影暗示 —— 右侧模糊轮廓 */}
      <div style={{
        position: 'absolute',
        right: -20, top: '5%',
        width: 220, height: '70%',
        background: `radial-gradient(ellipse at 60% 30%,
          rgba(140,90,255,0.35) 0%,
          rgba(80,40,200,0.2) 40%,
          transparent 70%)`,
        filter: 'blur(8px)',
      }} />

      {/* 头发/翅膀飘动感 */}
      <div style={{
        position: 'absolute',
        right: 10, top: '8%',
        width: 160, height: 280,
        background: `linear-gradient(135deg,
          rgba(180,100,255,0.3) 0%,
          rgba(100,150,255,0.2) 40%,
          transparent 70%)`,
        borderRadius: '30% 70% 60% 40% / 40% 60% 40% 60%',
        filter: 'blur(12px)',
        transform: 'rotate(-10deg)',
      }} />

      {/* 星光散点 */}
      {Array.from({ length: 24 }).map((_, i) => (
        <div key={`star-${i}`} style={{
          position: 'absolute',
          left: `${(i * 37 + 13) % 95}%`,
          top: `${(i * 29 + 7) % 80}%`,
          width: i % 3 === 0 ? 3 : 2,
          height: i % 3 === 0 ? 3 : 2,
          background: `rgba(255,255,255,${0.2 + (i % 5) * 0.12})`,
          borderRadius: '50%',
          boxShadow: i % 4 === 0 ? '0 0 4px rgba(180,160,255,0.6)' : 'none',
        }} />
      ))}

      {/* 整体模糊遮罩（营造景深/失焦感） */}
      <div style={{
        position: 'absolute', inset: 0,
        backdropFilter: 'blur(2px)',
        WebkitBackdropFilter: 'blur(2px)',
        background: 'rgba(5,5,20,0.1)',
      }} />
    </div>
  );
}

/* ──────────────────────────────────────────
   账号选择弹窗
   ────────────────────────────────────────── */
const ACCOUNTS = [
  {
    id: 'google',
    name: 'q1_88726192',
    lastLogin: '2026-03-26 13:45',
    recommended: true,
    badge: 'Google Linked',
  },
  {
    id: 'guest',
    name: 'guest_99120384',
    lastLogin: '2026-03-26 15:02',
    recommended: false,
  },
];

function ConsentDialog({ onAgree }) {
  const [selected, setSelected] = React.useState('google');
  const [pressing, setPressing] = React.useState(false);

  return (
    <div style={{
      background: 'rgba(255,255,255,0.96)',
      borderRadius: 20,
      padding: '28px 20px 24px',
      margin: '0 20px',
      boxShadow: '0 8px 40px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.15)',
      backdropFilter: 'blur(20px)',
      WebkitBackdropFilter: 'blur(20px)',
    }}>
      {/* 标题 */}
      <h2 style={{
        fontSize: 20,
        fontWeight: 700,
        color: '#3d9be9',
        textAlign: 'center',
        marginBottom: 12,
        fontFamily: '-apple-system, "PingFang SC", "Helvetica Neue", sans-serif',
        letterSpacing: '0.02em',
      }}>
        Select Account
      </h2>

      {/* 说明文字 */}
      <p style={{
        fontSize: 13,
        lineHeight: 1.65,
        color: '#666',
        textAlign: 'center',
        marginBottom: 20,
        fontFamily: '-apple-system, "PingFang SC", sans-serif',
        fontWeight: 400,
        padding: '0 4px',
      }}>
        Your Google account and this device's account have different game progress. Please select:
      </p>

      {/* 账号卡片列表 */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 20 }}>
        {ACCOUNTS.map(acc => {
          const isSelected = selected === acc.id;
          return (
            <div
              key={acc.id}
              onClick={() => setSelected(acc.id)}
              style={{
                padding: '14px 16px',
                borderRadius: 14,
                background: isSelected
                  ? 'linear-gradient(135deg, #e8f4ff 0%, #ddeeff 100%)'
                  : 'linear-gradient(135deg, #f5f7fa 0%, #eef1f5 100%)',
                border: isSelected
                  ? '1.5px solid rgba(33,150,243,0.55)'
                  : '1.5px solid rgba(200,210,225,0.8)',
                boxShadow: isSelected
                  ? '0 2px 12px rgba(33,150,243,0.12), inset 0 1px 0 rgba(255,255,255,0.9)'
                  : '0 1px 4px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.9)',
                cursor: 'pointer',
                transition: 'all 0.15s ease',
                position: 'relative',
                overflow: 'hidden',
              }}
            >
              {/* 选中时左侧蓝色指示条 */}
              {isSelected && (
                <div style={{
                  position: 'absolute',
                  left: 0, top: 0, bottom: 0,
                  width: 3,
                  background: 'linear-gradient(180deg, #2196f3 0%, #42b0ff 100%)',
                  borderRadius: '14px 0 0 14px',
                }} />
              )}

              {/* 推荐角标 — 贴右上角 */}
              {acc.recommended && (
                <div style={{
                  position: 'absolute',
                  top: 0, right: 0,
                  background: 'linear-gradient(135deg, #2196f3 0%, #42b0ff 100%)',
                  color: '#fff',
                  fontSize: 10,
                  fontWeight: 700,
                  padding: '3px 10px 3px 10px',
                  borderRadius: '0 14px 0 10px',
                  fontFamily: '-apple-system, "PingFang SC", sans-serif',
                  letterSpacing: '0.01em',
                  boxShadow: '0 2px 8px rgba(33,150,243,0.35)',
                }}>
                  {acc.badge}
                </div>
              )}

              {/* 账号名 */}
              <div style={{
                fontSize: 15,
                fontWeight: 600,
                color: isSelected ? '#1565c0' : '#2c3e50',
                marginBottom: 4,
                fontFamily: '-apple-system, "PingFang SC", sans-serif',
                paddingRight: acc.recommended ? 100 : 0,
                paddingLeft: isSelected ? 8 : 0,
                transition: 'padding 0.15s ease',
              }}>
                Account: {acc.name}
              </div>

              {/* 最后登录 */}
              <div style={{
                fontSize: 11,
                color: isSelected ? 'rgba(21,101,192,0.55)' : 'rgba(0,0,0,0.38)',
                fontFamily: '-apple-system, "PingFang SC", sans-serif',
                paddingLeft: isSelected ? 8 : 0,
                transition: 'padding 0.15s ease',
              }}>
                Last login: {acc.lastLogin}
              </div>
            </div>
          );
        })}
      </div>

      {/* 确定按钮 */}
      <button
        onPointerDown={() => setPressing(true)}
        onPointerUp={() => setPressing(false)}
        onPointerLeave={() => setPressing(false)}
        onClick={onAgree}
        style={{
          display: 'block',
          width: '100%',
          padding: '16px 0',
          borderRadius: 999,
          border: 'none',
          background: pressing
            ? 'linear-gradient(135deg, #1a7fd4 0%, #2ea5f5 100%)'
            : 'linear-gradient(135deg, #2196f3 0%, #42b0ff 100%)',
          color: '#fff',
          fontSize: 17,
          fontWeight: 600,
          fontFamily: '-apple-system, "PingFang SC", sans-serif',
          cursor: 'pointer',
          transform: pressing ? 'scale(0.98)' : 'scale(1)',
          transition: 'all 0.1s ease',
          boxShadow: pressing
            ? '0 2px 12px rgba(33,150,243,0.4)'
            : '0 4px 20px rgba(33,150,243,0.45)',
          letterSpacing: '0.02em',
        }}
      >
        Confirm
      </button>
    </div>
  );
}

/* ──────────────────────────────────────────
   完整屏幕
   ────────────────────────────────────────── */
function TrackingConsentScreen() {
  const [state, setState] = React.useState('select'); // select | confirmed

  return (
    <div style={{
      position: 'relative',
      width: '100%',
      height: '100%',
      display: 'flex',
      flexDirection: 'column',
      justifyContent: 'center',
    }}>
      <GameBackground />

      {/* 遮罩层 */}
      <div style={{
        position: 'absolute', inset: 0,
        background: 'rgba(0,0,0,0.25)',
        zIndex: 1,
      }} />

      {/* 弹窗 */}
      {state === 'select' && (
        <div style={{ position: 'relative', zIndex: 2 }}>
          <ConsentDialog onAgree={() => setState('confirmed')} />
        </div>
      )}

      {/* 确认后状态 */}
      {state === 'confirmed' && (
        <div style={{
          position: 'relative', zIndex: 2,
          textAlign: 'center', padding: '0 32px',
        }}>
          <div style={{
            width: 64, height: 64,
            background: 'linear-gradient(135deg, #2196f3, #42b0ff)',
            borderRadius: '50%',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            margin: '0 auto 20px',
            boxShadow: '0 4px 20px rgba(33,150,243,0.5)',
          }}>
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
              <path d="M6 14l6 6 10-12" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
            </svg>
          </div>
          <p style={{
            color: 'white', fontSize: 18, fontWeight: 600,
            fontFamily: '-apple-system, "PingFang SC", sans-serif',
            textShadow: '0 2px 8px rgba(0,0,0,0.4)',
          }}>Account selected successfully</p>
          <button
            onClick={() => setState('select')}
            style={{
              marginTop: 16,
              padding: '8px 20px',
              background: 'rgba(255,255,255,0.1)',
              border: '1px solid rgba(255,255,255,0.2)',
              borderRadius: 8,
              color: 'rgba(255,255,255,0.6)', fontSize: 13,
              fontFamily: '-apple-system, "PingFang SC", sans-serif',
              cursor: 'pointer',
            }}
          >
            Back
          </button>
        </div>
      )}
    </div>
  );
}

/* ──────────────────────────────────────────
   页面外壳：居中展示 iPhone
   ────────────────────────────────────────── */
function App() {
  return (
    <div style={{
      width: '100vw', height: '100vh',
      display: 'flex',
      alignItems: 'center',
      justifyContent: 'center',
      background: '#0a0a18',
      fontFamily: '-apple-system, "PingFang SC", sans-serif',
    }}>
      <IosFrame time="9:41" battery={87} width={393} height={852}>
        <TrackingConsentScreen />
      </IosFrame>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
