<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function () {
      var adminOldBase = '/glacierClub/SDK/admin-old/build/';
      var path = window.location.pathname;

      if (path.indexOf(adminOldBase) === 0) {
        var route = path.slice(adminOldBase.length).replace(/^\/+/, '');
        var target = adminOldBase + (window.location.search || '');

        if (route && route !== 'index.html') {
          target += '#/' + route;
        } else {
          target += window.location.hash || '';
        }

        window.location.replace(target);
      }
    }());
  </script>
</head>
<body>
  Not found
</body>
</html>
